# GV-TESTS-MOTEURS : contrôle INFORMATIF, NON BLOQUANT (ne jamais l'ajouter aux contrôles exigés de la protection de `master`).
# À quoi il sert : quand une PR modifie un moteur de montage, les sous-titres, le motion, les LUT, les miniatures,
# le conteneur de rendu ou l'aligneur, il relance les tests DÉJÀ EXISTANTS de cette zone (pas la suite complète : la file
# gratuite de GitHub est saturée). Le résultat s'affiche sur la PR, mais un rouge n'empêche jamais de fusionner :
# `continue-on-error: true` est posé sur chaque tâche. Informatif tant qu'il n'a pas fait ses preuves (accord entre équipes).
# Complète `verifier` (qui ne lance que les fichiers de test touchés), `tests-cibles` et `tests-scripts` : on ne les double pas.
# Aucun secret, lecture seule du dépôt.
#
# Une modification du seul fichier du workflow ne lance qu'une petite zone témoin (LUT) ; toutes les zones : lancement manuel seulement.
# Chaque tâche écrit dans le résumé de l'exécution : nombre de tests lancés, d'échecs, 30 premiers fichiers en échec.
#
# Pas de tâche pour le pytest de studio-aligneur : ses exigences (requirements.txt) installent PyTorch, torchaudio,
# MediaPipe, OpenCV et faster-whisper, trop lourds pour la file gratuite. À reprendre seulement si un sous-ensemble de
# tests tourne sans ces bibliothèques.
name: gv-tests-moteurs

on:
  pull_request:
    branches: [master]
    paths:
      - "src/moteurs/montage-avocat/**"
      - "src/moteurs/montage-image-video/**"
      - "src/moteurs/montage-facecam/**"
      - "src/moteurs/montage-facecam-animee/**"
      - "src/moteurs/montage-demo-facecam/**"
      - "src/moteurs/montage-tutoriel-outil/**"
      - "src/moteurs/montage-vitrines/**"
      - "src/moteurs/montage-cas-concret/**"
      - "src/briques/sous-titres/**"
      - "src/briques/motion/**"
      - "src/briques/schema-motion/**"
      - "src/briques/jetons-motion.ts"
      - "src/lib/lut3d.ts"
      - "src/donnees/luts-axion.ts"
      - "studio-rendu/**"
      - "src/services/travaux.ts"
      - "src/services/miniatures*.ts"
      - "src/domaine/vignettes*.ts"
      - "studio-aligneur/**"
      - ".github/workflows/gv-tests-moteurs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau lancement sur la même branche annule l'ancien.
concurrency:
  group: gv-tests-moteurs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Repère les zones modifiées (lancement manuel : toutes les zones).
  zones:
    name: repérage des zones modifiées
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    outputs:
      tests: ${{ steps.liste.outputs.tests }}
      rendu: ${{ steps.liste.outputs.rendu }}
      deps-rendu: ${{ steps.liste.outputs.deps-rendu }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Zones touchées
        id: liste
        env:
          EVENEMENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENEMENT" = "pull_request" ]; then
            git diff --name-only "$BASE"...HEAD > modifies.txt
          else
            echo ".github/workflows/gv-tests-moteurs.yml" > modifies.txt
          fi
          cat modifies.txt
          # Lancement manuel : toutes les zones. Workflow seul modifié : une petite zone témoin (LUT), voir plus bas.
          if [ "$EVENEMENT" = "pull_request" ]; then TOUT=0; else TOUT=1; fi

          # Table zone modifiée -> tests existants (filtres vitest : un morceau de chemin suffit).
          : > filtres.txt
          # Les arguments de test sont des motifs de fichiers que le shell développe (pas de filtre par morceau de nom :
          # « tests/facecam-* » attraperait aussi le dossier facecam-animee).
          zone() { # $1 = expression régulière sur les fichiers modifiés, les suivants = fichiers ou dossiers de test
            motif="$1"; shift
            if [ "$TOUT" = "1" ] || grep -Eq "$motif" modifies.txt; then
              for f in "$@"; do echo "$f" >> filtres.txt; done
            fi
          }
          zone '^src/moteurs/montage-facecam/' tests/facecam-*.test.ts
          zone '^src/moteurs/montage-facecam-animee/' tests/facecam-animee
          zone '^src/moteurs/montage-image-video/' tests/image-video
          zone '^src/moteurs/montage-avocat/' tests/a2-*.test.ts tests/montage-avocat.*.test.ts tests/moteur-avocat-*.test.ts
          zone '^src/moteurs/montage-tutoriel-outil/' tests/tutoriel-outil
          zone '^src/moteurs/montage-demo-facecam/' src/moteurs/montage-demo-facecam
          zone '^src/moteurs/montage-vitrines/' src/moteurs/montage-vitrines
          # Cas concret : tests-cibles lance déjà une dizaine de fichiers (variete, ecriture, suivi, script-valide, sujets-traites) et
          # tests-scripts lance x4 ; on lance le reste du dossier, en excluant ces fichiers à l'étape de test.
          # montage-tableau : tests/tableau est déjà lancé en entier par tests-scripts, rien à ajouter ici.
          zone '^src/moteurs/montage-cas-concret/' tests/cas-concret
          zone '^src/briques/sous-titres/' src/briques/sous-titres tests/sous-titres-*.test.ts
          zone '^src/(lib/lut3d|donnees/luts-axion)\.ts$|^studio-rendu/src/lut\.ts$' tests/luts.test.ts tests/apercu-lut.test.ts
          zone '^src/(services/miniatures|domaine/vignettes|services/travaux\.ts)' tests/vignettes-*.test.ts tests/r4-miniatures*.test.ts
          zone '^src/briques/(motion/|schema-motion/|jetons-motion\.ts)' tests/facecam-motion-*.test.ts
          # Seul le workflow a changé sur une PR : zone témoin légère.
          if [ "$EVENEMENT" = "pull_request" ] && ! grep -qv '^\.github/workflows/gv-tests-moteurs\.yml$' modifies.txt; then
            echo tests/luts.test.ts >> filtres.txt; echo tests/apercu-lut.test.ts >> filtres.txt
          fi
          sort -u filtres.txt > filtres-uniques.txt
          echo "Filtres de test retenus :"; cat filtres-uniques.txt
          echo "tests=$(tr '\n' ' ' < filtres-uniques.txt)" >> "$GITHUB_OUTPUT"

          # Les tests de ces zones importent studio-rendu/… : il faut y installer ses dépendances (hors espace de travail pnpm).
          if grep -Eq 'tests/(facecam-animee|image-video|cas-concret)' filtres-uniques.txt; then
            echo "deps-rendu=oui" >> "$GITHUB_OUTPUT"
          else
            echo "deps-rendu=non" >> "$GITHUB_OUTPUT"
          fi

          if [ "$EVENEMENT" != "pull_request" ] || grep -q '^studio-rendu/' modifies.txt; then
            echo "rendu=oui" >> "$GITHUB_OUTPUT"
          else
            echo "rendu=non" >> "$GITHUB_OUTPUT"
          fi

  # Relance les tests existants de la zone modifiée (jamais la suite complète).
  tests-zone:
    name: tests existants de la zone modifiée
    needs: zones
    if: needs.zones.outputs.tests != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-node@v4
        if: needs.zones.outputs.deps-rendu == 'oui'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-rendu/package-lock.json
      - name: Dépendances de studio-rendu
        if: needs.zones.outputs.deps-rendu == 'oui'
        working-directory: studio-rendu
        run: npm ci --ignore-scripts
      - name: Tests de la zone
        env:
          FILTRES: ${{ needs.zones.outputs.tests }}
        run: |
          # $FILTRES est volontairement non guillemeté : une liste de morceaux de chemin séparés par des espaces.
          pnpm exec vitest run --testTimeout=60000 --passWithNoTests --reporter=json --outputFile=rapport-vitest.json \n            --exclude '**/node_modules/**' \n            --exclude 'tests/cas-concret/variete/variete.test.ts' \n            --exclude 'tests/cas-concret/variete/l6.test.ts' \n            --exclude 'tests/cas-concret/variete/maquettes-par-canal.test.ts' \n            --exclude 'tests/cas-concret/variete/part-v4-centree.test.ts' \n            --exclude 'tests/cas-concret/variete/structure-chaine.test.ts' \n            --exclude 'tests/cas-concret/variete/fiche-et-chaine.test.ts' \n            --exclude 'tests/cas-concret/variete/habillage.test.ts' \n            --exclude 'tests/cas-concret/ecriture/ecriture.test.ts' \n            --exclude 'tests/cas-concret/suivi/suivi.test.ts' \n            --exclude 'tests/cas-concret/suivi/numero-suivi-unique.test.ts' \n            --exclude 'tests/cas-concret/sujets-traites/controle-sujet.test.ts' \n            --exclude 'tests/cas-concret/variete-scripts/**' --exclude 'tests/cas-concret/script-valide/**' \n            --exclude 'tests/cas-concret/x4/**' \n            $FILTRES || true
          # Résumé lisible sans ouvrir les journaux : tests lancés, échecs, 30 premiers fichiers en échec.
          node -e '
            const r = JSON.parse(require("fs").readFileSync("rapport-vitest.json", "utf8"));
            const fich = r.testResults || [];
            const lances = fich.reduce((n, f) => n + (f.assertionResults || []).length, 0);
            const rates = fich.filter((f) => f.status === "failed").map((f) => f.name.replace(/\x5c/g, "/").replace(/^.*\/((tests|src)\/)/, "$1"));
            const nbEchecs = fich.reduce((n, f) => n + (f.assertionResults || []).filter((c) => c.status === "failed").length, 0);
            const l = ["### Tests de la zone", "", "Tests lancés : " + lances, "Échecs : " + nbEchecs + " (dans " + rates.length + " fichiers)", "", "30 premiers fichiers en échec :"];
            for (const f of rates.slice(0, 30)) l.push("- " + f);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, l.join(String.fromCharCode(10)) + String.fromCharCode(10));
          ' || echo "Résumé impossible (rapport illisible)" >> "$GITHUB_STEP_SUMMARY"
          node scripts/comparer-echecs.mjs rapport-vitest.json scripts/echecs-connus.json

  # Contrôle de types du conteneur de rendu (npm run verifier = tsc --noEmit), seulement si studio-rendu change.
  types-studio-rendu:
    name: types de studio-rendu
    needs: zones
    if: needs.zones.outputs.rendu == 'oui'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: studio-rendu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-rendu/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Contrôle de types
        run: |
          code=0
          npm run verifier > tsc.txt 2>&1 || code=$?
          tail -n 30 tsc.txt
          {
            echo "### Types de studio-rendu"
            echo ""
            echo "Erreurs de types : $(grep -c 'error TS' tsc.txt || true)"
            echo ""
            echo "30 premiers fichiers en erreur :"
            grep 'error TS' tsc.txt | sed 's/(.*//' | sort -u | head -n 30 | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
