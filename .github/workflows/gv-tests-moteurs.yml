# GV-TESTS-MOTEURS : contrôle INFORMATIF, NON BLOQUANT (ne jamais l'ajouter aux contrôles exigés de la protection de `master`).
# À quoi il sert : quand une PR modifie un moteur de montage, les sous-titres, le motion, les LUT, les miniatures,
# le conteneur de rendu ou l'aligneur, il relance les tests DÉJÀ EXISTANTS de cette zone (pas la suite complète : la file
# gratuite de GitHub est saturée). Le résultat s'affiche sur la PR, mais un rouge n'empêche jamais de fusionner :
# `continue-on-error: true` est posé sur chaque tâche. Informatif tant qu'il n'a pas fait ses preuves (accord entre équipes).
# Complète `verifier` (qui ne lance que les fichiers de test touchés), `tests-cibles` et `tests-scripts` : on ne les double pas.
# Aucun secret, lecture seule du dépôt.
#
# Une modification du seul fichier du workflow ne lance qu'une petite zone témoin (LUT) ; toutes les zones : lancement manuel seulement.
# Chaque tâche écrit dans le résumé de l'exécution : nombre de tests lancés, d'échecs, 30 premiers fichiers en échec.
#
# Pas de tâche pour le pytest de studio-aligneur : ses exigences (requirements.txt) installent PyTorch, torchaudio,
# MediaPipe, OpenCV et faster-whisper, trop lourds pour la file gratuite. À reprendre seulement si un sous-ensemble de
# tests tourne sans ces bibliothèques.
name: gv-tests-moteurs

on:
  pull_request:
    branches: [master]
    paths:
      - "src/moteurs/montage-avocat/**"
      - "src/moteurs/montage-image-video/**"
      - "src/moteurs/montage-facecam/**"
      - "src/moteurs/montage-facecam-animee/**"
      - "src/moteurs/montage-demo-facecam/**"
      - "src/moteurs/montage-tutoriel-outil/**"
      - "src/moteurs/montage-vitrines/**"
      - "src/moteurs/montage-cas-concret/**"
      - "src/briques/sous-titres/**"
      - "src/briques/motion/**"
      - "src/briques/schema-motion/**"
      - "src/briques/jetons-motion.ts"
      - "src/lib/lut3d.ts"
      - "src/donnees/luts-axion.ts"
      - "studio-rendu/**"
      - "src/services/travaux.ts"
      - "src/services/miniatures*.ts"
      - "src/domaine/vignettes*.ts"
      - "studio-aligneur/**"
      - ".github/workflows/gv-tests-moteurs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau lancement sur la même branche annule l'ancien.
concurrency:
  group: gv-tests-moteurs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Repère les zones modifiées (lancement manuel : toutes les zones).
  zones:
    name: repérage des zones modifiées
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    outputs:
      tests: ${{ steps.liste.outputs.tests }}
      rendu: ${{ steps.liste.outputs.rendu }}
      deps-rendu: ${{ steps.liste.outputs.deps-rendu }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Zones touchées
        id: liste
        env:
          EVENEMENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENEMENT" = "pull_request" ]; then
            git diff --name-only "$BASE"...HEAD > modifies.txt
          else
            echo ".github/workflows/gv-tests-moteurs.yml" > modifies.txt
          fi
          cat modifies.txt
          # Lancement manuel : toutes les zones. Workflow seul modifié : une petite zone témoin (LUT), voir plus bas.
          if [ "$EVENEMENT" = "pull_request" ]; then TOUT=0; else TOUT=1; fi

          # Table zone modifiée -> tests existants (filtres vitest : un morceau de chemin suffit).
          : > filtres.txt
          # Les arguments de test sont des motifs de fichiers que le shell développe (pas de filtre par morceau de nom :
          # « tests/facecam-* » attraperait aussi le dossier facecam-animee).
          zone() { # $1 = expression régulière sur les fichiers modifiés, les suivants = fichiers ou dossiers de test
            motif="$1"; shift
            if [ "$TOUT" = "1" ] || grep -Eq "$motif" modifies.txt; then
              for f in "$@"; do echo "$f" >> filtres.txt; done
            fi
          }
          zone '^src/moteurs/montage-facecam/' tests/facecam-*.test.ts
          zone '^src/moteurs/montage-facecam-animee/' tests/facecam-animee
          zone '^src/moteurs/montage-image-video/' tests/image-video
          zone '^src/moteurs/montage-avocat/' tests/a2-*.test.ts tests/montage-avocat.*.test.ts tests/moteur-avocat-*.test.ts
          zone '^src/moteurs/montage-tutoriel-outil/' tests/tutoriel-outil
          zone '^src/moteurs/montage-demo-facecam/' src/moteurs/montage-demo-facecam
          zone '^src/moteurs/montage-vitrines/' src/moteurs/montage-vitrines
          # Cas concret : tests-cibles lance déjà une dizaine de fichiers (variete, ecriture, suivi, script-valide, sujets-traites) et
          # tests-scripts lance x4 ; on lance le reste du dossier, en excluant ces fichiers à l'étape de test.
          # montage-tableau : tests/tableau est déjà lancé en entier par tests-scripts, rien à ajouter ici.
          zone '^src/moteurs/montage-cas-concret/' tests/cas-concret
          zone '^src/briques/sous-titres/' src/briques/sous-titres tests/sous-titres-*.test.ts
          zone '^src/(lib/lut3d|donnees/luts-axion)\.ts$|^studio-rendu/src/lut\.ts$' tests/luts.test.ts tests/apercu-lut.test.ts
          zone '^src/(services/miniatures|domaine/vignettes|services/travaux\.ts)' tests/vignettes-*.test.ts tests/r4-miniatures*.test.ts
          zone '^src/briques/(motion/|schema-motion/|jetons-motion\.ts)' tests/facecam-motion-*.test.ts
          # Seul le workflow a changé sur une PR : zone témoin légère.
          if [ "$EVENEMENT" = "pull_request" ] && ! grep -qv '^\.github/workflows/gv-tests-moteurs\.yml$' modifies.txt; then
            echo tests/luts.test.ts >> filtres.txt; echo tests/apercu-lut.test.ts >> filtres.txt
          fi
          sort -u filtres.txt > filtres-uniques.txt
          echo "Filtres de test retenus :"; cat filtres-uniques.txt
          echo "tests=$(tr '\n' ' ' < filtres-uniques.txt)" >> "$GITHUB_OUTPUT"

          # Les tests de ces zones importent studio-rendu/… : il faut y installer ses dépendances (hors espace de travail pnpm).
          if grep -Eq 'tests/(facecam-animee|image-video|cas-concret)' filtres-uniques.txt; then
            echo "deps-rendu=oui" >> "$GITHUB_OUTPUT"
          else
            echo "deps-rendu=non" >> "$GITHUB_OUTPUT"
          fi

          if [ "$EVENEMENT" != "pull_request" ] || grep -q '^studio-rendu/' modifies.txt; then
            echo "rendu=oui" >> "$GITHUB_OUTPUT"
          else
            echo "rendu=non" >> "$GITHUB_OUTPUT"
          fi

  # Relance les tests existants de la zone modifiée (jamais la suite complète).
  # Mesure des tests de la zone : la tête et la base tournent EN PARALLÈLE (deux tâches, chacune avec sa limite de 30 min).
  # Chaque tâche dépose son rapport vitest en artefact ; la tâche finale « tests existants de la zone modifiée » les compare.
  mesure:
    name: mesure (${{ matrix.cote }})
    needs: zones
    if: needs.zones.outputs.tests != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        cote: [tete, base]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-node@v4
        if: needs.zones.outputs.deps-rendu == 'oui'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-rendu/package-lock.json
      - name: Dépendances de studio-rendu
        if: needs.zones.outputs.deps-rendu == 'oui'
        working-directory: studio-rendu
        run: npm ci --ignore-scripts
      - name: Tests de la zone (${{ matrix.cote }})
        # Limite de l'étape un peu sous celle de la tâche : si les tests sont trop longs, l'étape s'arrête proprement
        # et l'artefact est quand même déposé (avec le statut « coupe »).
        timeout-minutes: 27
        env:
          COTE: ${{ matrix.cote }}
          FILTRES: ${{ needs.zones.outputs.tests }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p rapports
          RACINE="$PWD"
          # Statut écrit avant le lancement : s'il reste « coupe », la mesure a été arrêtée par la limite de temps.
          echo coupe > "rapports/statut-$COTE.txt"
          lancer() { # $1 = fichier du rapport JSON ; à lancer depuis la racine à tester
            # $FILTRES est volontairement non guillemeté : une liste de morceaux de chemin séparés par des espaces.
            pnpm exec vitest run --testTimeout=60000 --passWithNoTests --reporter=json --outputFile="$1" \
              --exclude '**/node_modules/**' \
              --exclude 'tests/cas-concret/variete/variete.test.ts' \
              --exclude 'tests/cas-concret/variete/l6.test.ts' \
              --exclude 'tests/cas-concret/variete/maquettes-par-canal.test.ts' \
              --exclude 'tests/cas-concret/variete/part-v4-centree.test.ts' \
              --exclude 'tests/cas-concret/variete/structure-chaine.test.ts' \
              --exclude 'tests/cas-concret/variete/fiche-et-chaine.test.ts' \
              --exclude 'tests/cas-concret/variete/habillage.test.ts' \
              --exclude 'tests/cas-concret/ecriture/ecriture.test.ts' \
              --exclude 'tests/cas-concret/suivi/suivi.test.ts' \
              --exclude 'tests/cas-concret/suivi/numero-suivi-unique.test.ts' \
              --exclude 'tests/cas-concret/sujets-traites/controle-sujet.test.ts' \
              --exclude 'tests/cas-concret/variete-scripts/**' --exclude 'tests/cas-concret/script-valide/**' \
              --exclude 'tests/cas-concret/x4/**' \
              $FILTRES || true
          }
          if [ "$COTE" = "tete" ]; then
            lancer "$RACINE/rapports/rapport-tete.json"
            # Résumé lisible sans ouvrir les journaux : tests lancés, échecs, 30 premiers fichiers en échec.
            node -e '
              const r = JSON.parse(require("fs").readFileSync("rapports/rapport-tete.json", "utf8"));
              const fich = r.testResults || [];
              const lances = fich.reduce((n, f) => n + (f.assertionResults || []).length, 0);
              const rates = fich.filter((f) => f.status === "failed").map((f) => f.name.replace(/\x5c/g, "/").replace(/^.*\/((tests|src)\/)/, "$1"));
              const nbEchecs = fich.reduce((n, f) => n + (f.assertionResults || []).filter((c) => c.status === "failed").length, 0);
              const l = ["### Tests de la zone", "", "Tests lancés : " + lances, "Échecs : " + nbEchecs + " (dans " + rates.length + " fichiers)", "", "30 premiers fichiers en échec :"];
              for (const f of rates.slice(0, 30)) l.push("- " + f);
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, l.join(String.fromCharCode(10)) + String.fromCharCode(10));
            ' || echo "Résumé impossible (rapport illisible)" >> "$GITHUB_STEP_SUMMARY"
          else
            # Base = ancêtre commun (git merge-base) de la tête et de la branche de base (lancement manuel : origin/master).
            # Si elle ne se prépare pas : pas de rapport, la tâche finale se replie sur la liste des échecs connus.
            if [ -n "$BASE_PR" ]; then BASE=$(git merge-base HEAD "$BASE_PR"); else BASE=$(git merge-base HEAD origin/master); fi
            if git worktree add "$RUNNER_TEMP/base" "$BASE"; then
              ln -s "$RACINE/node_modules" "$RUNNER_TEMP/base/node_modules"
              if [ -d "$RACINE/studio-rendu/node_modules" ] && [ -d "$RUNNER_TEMP/base/studio-rendu" ]; then
                ln -s "$RACINE/studio-rendu/node_modules" "$RUNNER_TEMP/base/studio-rendu/node_modules"
              fi
              (cd "$RUNNER_TEMP/base" && lancer "$RACINE/rapports/rapport-base.json") || true
            fi
          fi
          echo fini > "rapports/statut-$COTE.txt"
      - name: Dépôt du rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-${{ matrix.cote }}
          path: rapports/
          if-no-files-found: ignore
          retention-days: 3

  # Tâche finale : compare la tête et la base (rouge seulement pour un test rouge sur la tête et vert ou absent sur la base).
  # C'est ce contrôle-là que les sessions lisent sur la PR.
  tests-zone:
    name: tests existants de la zone modifiée
    needs: [zones, mesure]
    if: always() && needs.zones.outputs.tests != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: rapport-*
          path: rapports
          merge-multiple: true
      - name: Comparaison tête / base
        env:
          RESULTAT_MESURE: ${{ needs.mesure.result }}
        run: |
          cat > "$RUNNER_TEMP/comparer-base-tete.mjs" <<'JS'
          import { readFileSync, existsSync, appendFileSync } from "node:fs";
          import { pathToFileURL } from "node:url";
          const [, , chemTete, chemBase, chemOutil] = process.argv;
          const { extraireEchecs, compterLances } = await import(pathToFileURL(chemOutil).href);
          const tete = JSON.parse(readFileSync(chemTete, "utf8"));
          const cle = (e) => e.fichier + "\u0000" + e.nom;
          const echecsTete = extraireEchecs(tete);
          const lances = compterLances(tete);
          let echecsBase = null;
          if (existsSync(chemBase)) {
            try {
              const rapportBase = JSON.parse(readFileSync(chemBase, "utf8"));
              // Aucun test lancé sur la base (vitest a planté en écrivant un rapport vide) : base illisible, pas « zéro échec ».
              echecsBase = compterLances(rapportBase) === 0 ? null : extraireEchecs(rapportBase);
            } catch { echecsBase = null; }
          }
          const l = ["", "### Tests de la zone : différence avec la base", ""];
          if (echecsBase === null) {
            l.push("Rapport de la base illisible, vide (aucun test lancé) ou absent : comparaison impossible.");
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, l.join("\n") + "\n");
            process.exit(2);
          }
          const surBase = new Set(echecsBase.map(cle));
          const nouveaux = echecsTete.filter((e) => !surBase.has(cle(e)));
          l.push("Échecs sur la base : " + echecsBase.length, "Échecs sur la tête : " + echecsTete.length, "Échecs NOUVEAUX : " + nouveaux.length, "");
          for (const e of nouveaux.slice(0, 50)) l.push("- " + e.fichier + " › " + e.nom);
          if (lances === 0) l.push("", "Aucun test lancé sur la tête.");
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, l.join("\n") + "\n");
          for (const e of nouveaux) console.log("NOUVEAU : " + e.fichier + " › " + e.nom);
          process.exit(nouveaux.length === 0 && lances > 0 ? 0 : 1);
          JS
          # Une mesure coupée par la limite de temps (ou jamais terminée) n'est pas un test rouge : on le dit clairement.
          statut() { cat "rapports/statut-$1.txt" 2>/dev/null || echo absent; }
          coupee=0
          for cote in tete base; do
            if [ "$(statut $cote)" != "fini" ]; then
              coupee=1
              msg="Mesure « $cote » coupée par la limite de temps (ou interrompue avant la fin, résultat de la mesure : $RESULTAT_MESURE) : ce n'est pas un test rouge."
              echo "::warning::$msg"
              printf '### Tests de la zone\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "$coupee" = "1" ]; then exit 1; fi
          if [ ! -f rapports/rapport-tete.json ]; then
            echo "::warning::Rapport de la tête absent alors que la mesure est finie : comparaison impossible."
            echo "Rapport de la tête absent : comparaison impossible." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          code=0
          node "$RUNNER_TEMP/comparer-base-tete.mjs" rapports/rapport-tete.json rapports/rapport-base.json "$PWD/scripts/comparer-echecs.mjs" || code=$?
          if [ "$code" = "2" ]; then
            # Repli : liste des échecs connus (ancien comportement).
            node scripts/comparer-echecs.mjs rapports/rapport-tete.json scripts/echecs-connus.json
          else
            exit "$code"
          fi

  # Contrôle de types du conteneur de rendu (npm run verifier = tsc --noEmit), seulement si studio-rendu change.
  types-studio-rendu:
    name: types de studio-rendu
    needs: zones
    if: needs.zones.outputs.rendu == 'oui'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: studio-rendu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-rendu/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Contrôle de types, tête puis base (rouge seulement pour une erreur NOUVELLE)
        env:
          BASE_PR: ${{ github.event.pull_request.base.sha }}
        run: |
          # Base = ancêtre commun (git merge-base) de la tête et de la branche de base (lancement manuel : origin/master).
          # Erreurs comparées par fichier + code + message, sans numéro de ligne ni de colonne.
          norm() { grep -E 'error TS' "$1" | sed -E 's/\([0-9]+,[0-9]+\)//' | sort || true; }
          code=0
          npm run verifier -- --pretty false > tsc-tete.txt 2>&1 || code=$?
          tail -n 30 tsc-tete.txt
          norm tsc-tete.txt > erreurs-tete.txt
          if [ -n "$BASE_PR" ]; then BASE=$(git merge-base HEAD "$BASE_PR"); else BASE=$(git merge-base HEAD origin/master); fi
          : > erreurs-base.txt
          base_ok=non
          if git worktree add "$RUNNER_TEMP/base" "$BASE" && [ -d "$RUNNER_TEMP/base/studio-rendu" ]; then
            ln -s "$PWD/node_modules" "$RUNNER_TEMP/base/studio-rendu/node_modules"
            (cd "$RUNNER_TEMP/base/studio-rendu" && npm run verifier -- --pretty false > "$OLDPWD/tsc-base.txt" 2>&1) || true
            norm tsc-base.txt > erreurs-base.txt
            base_ok=oui
          fi
          # Erreurs présentes sur la tête et absentes de la base (comm tient compte des doublons).
          comm -13 erreurs-base.txt erreurs-tete.txt > erreurs-nouvelles.txt
          avant=$(wc -l < erreurs-base.txt); apres=$(wc -l < erreurs-tete.txt); nouvelles=$(wc -l < erreurs-nouvelles.txt)
          {
            echo "### Types de studio-rendu"
            echo ""
            if [ "$base_ok" = "non" ]; then echo "Base illisible : comparaison impossible, toutes les erreurs comptent comme nouvelles."; echo ""; fi
            echo "Erreurs avant (base) : $avant"
            echo "Erreurs après (tête) : $apres"
            echo "Erreurs NOUVELLES : $nouvelles"
            echo ""
            echo "50 premières erreurs nouvelles :"
            head -n 50 erreurs-nouvelles.txt | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          # tsc a échoué sans produire d'erreur lisible : on ne le laisse pas passer pour vert.
          if [ "$code" != "0" ] && [ "$apres" = "0" ]; then echo "tsc a échoué sans erreur de type lisible (code $code)"; exit "$code"; fi
          [ "$nouvelles" = "0" ]
