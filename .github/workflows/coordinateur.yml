# COORDINATEUR DE FUSION SANS IA [L0-18] : toutes les 30 minutes, fusionne (squash) les PR usine/* vertes, relues et non sensibles.
# MODE PAR DÉFAUT : « à blanc » (il liste, ne fusionne rien) tant que la variable du dépôt COORDINATEUR_FUSION n'est pas « oui ».
# Aucun modèle d'IA. Aucun secret (jeton automatique du dépôt seulement). Aucun déclencheur lié aux PR : le code d'une PR
# n'est jamais récupéré ni exécuté ; on lit seulement des métadonnées avec gh. Cette PR (.github) est fusionnée par le fondateur.
name: coordinateur

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: coordinateur
  cancel-in-progress: false

jobs:
  coordonner:
    name: coordonner les fusions
    if: github.repository == 'will383842/studio-axion-ia-public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: coordinateur
        run: node scripts/coordinateur.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COORDINATEUR_FUSION: ${{ vars.COORDINATEUR_FUSION || 'non' }}
