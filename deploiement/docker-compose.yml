# Studio vidéo Axion-IA — installation sur le serveur axionia-web, À CÔTÉ du site, séparée de lui.
# - aucune base, aucun volume, aucun réseau partagé avec axion-ia.com ;
# - quatre services : la base, le studio, `studio-rendu` (rendu sans état, réseau interne, lot M1b) et
#   `studio-aligneur` (calage des sous-titres, sans état, réseau interne, lot « calage ») ;
# - le seul lien est le proxy commun (Traefik de Coolify) qui oriente studio.axion-ia.com ;
# - les secrets viennent de /opt/studio-axion-ia/.env (jamais dans le dépôt).
# Mise à jour : deploiement/mettre-a-jour.sh (sur le serveur).
name: studio-axion-ia

# Audit D : journaux de Docker BORNÉS (avant : aucune rotation, le disque pouvait se remplir). 5 fichiers de 20 Mo au
# plus par service. Repris par les 4 services (`logging: *journaux`).
x-journaux: &journaux
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  base:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?manquant}
    volumes:
      - donnees:/var/lib/postgresql/data
    networks: [interne]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging: *journaux
    # Arrêt propre de Postgres (point de reprise écrit) avant le SIGKILL.
    stop_grace_period: 60s

  studio:
    build:
      context: ..
      # Identifiants d'actions stables d'une mise en ligne à l'autre (constat du 10/10) : clé fixe du .env. Vide = clé
      # aléatoire à chaque construction (comportement d'avant).
      args:
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
        # Version en ligne (commit court), posée par mettre-a-jour.sh ; lue par /api/sante. Vide = « inconnu ».
        STUDIO_COMMIT: ${STUDIO_COMMIT:-}
    image: studio-axion-ia:local
    restart: unless-stopped
    # Audit D : UN SEUL réplica. Les données sont recopiées en mémoire et les verrous vivent dans le processus : deux
    # studios en même temps s'écraseraient. Ne jamais lancer `--scale studio=2`. Garde-fou dans le code : la boucle de
    # fond (et la boucle d'écriture, la veille) ne tournent que dans l'instance qui tient le verrou Postgres
    # (`pg_try_advisory_lock`) ; une seconde instance ne les lance pas et `/api/sante` y répond 503 au bout de 3 min.
    deploy:
      replicas: 1
    logging: *journaux
    # Laisse finir les écritures en cours (réponses des fournisseurs déjà payées) avant le SIGKILL.
    stop_grace_period: 30s
    depends_on:
      base: { condition: service_healthy }
    environment:
      # Tas V8 plafonné AVANT la limite du conteneur (2 Go) : sans cela Node laisse le tas gonfler jusqu'à ~1,5 Go de déchets
      # (copies des dépôts) puis le noyau tue le processus (OOM du 17/10). Le GC passe désormais avant la limite.
      NODE_OPTIONS: --max-old-space-size=1280
      DATABASE_URL: postgresql://studio:${POSTGRES_PASSWORD}@base:5432/studio
      STUDIO_PASSWORD_HASH_B64: ${STUDIO_PASSWORD_HASH_B64:?manquant}
      SESSION_SECRET: ${SESSION_SECRET:?manquant}
      # Le studio n'est joignable que derrière Cloudflare : l'adresse réelle du visiteur est dans cet en-tête.
      STUDIO_ENTETE_IP: cf-connecting-ip
      # --- Lots M0b et M1b : chaque outil réel ne s'active QUE si sa variable existe (sinon : simulation). ---
      # Le compose ne transmet que les variables listées ici (pas d'env_file) : modèle dans deploiement/env.exemple.
      HEYGEN_API_KEY: ${HEYGEN_API_KEY:-}
      HEYGEN_WEBHOOK_SECRET: ${HEYGEN_WEBHOOK_SECRET:-}
      # Lot R7 : taille maximale d'une vidéo HeyGen téléchargée (Mo ; vide = 2048).
      HEYGEN_VIDEO_MAX_MO: ${HEYGEN_VIDEO_MAX_MO:-}
      FOURNISSEUR_VOIX: ${FOURNISSEUR_VOIX:-}
      FOURNISSEUR_STOCKAGE: ${FOURNISSEUR_STOCKAGE:-}
      # Lot M4 : « studio-rendu » quand le montage réel est relié (sinon la simulation reste).
      FOURNISSEUR_MONTAGE: ${FOURNISSEUR_MONTAGE:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_HOST: ${R2_PUBLIC_HOST:-}
      # Lot R3 : « web-push-email » relie les notifications (téléphone + e-mail) ; vide = simulation (rien ne part).
      # Le réglage de Réglages > Connexions, s'il est posé, l'emporte.
      FOURNISSEUR_NOTIFICATION: ${FOURNISSEUR_NOTIFICATION:-}
      VAPID_PUBLIQUE: ${VAPID_PUBLIQUE:-}
      VAPID_PRIVEE: ${VAPID_PRIVEE:-}
      VAPID_SUJET: ${VAPID_SUJET:-}
      EMAIL_SECOURS_CLE: ${EMAIL_SECOURS_CLE:-}
      EMAIL_SECOURS_EXPEDITEUR: ${EMAIL_SECOURS_EXPEDITEUR:-}
      EMAIL_SECOURS_DESTINATAIRE: ${EMAIL_SECOURS_DESTINATAIRE:-}
      # Vide : rendu simulé. Réel : http://studio-rendu:4100 (une fois R2 relié).
      STUDIO_RENDU_URL: ${STUDIO_RENDU_URL:-}
      STUDIO_RENDU_CLE: ${STUDIO_RENDU_CLE:-}
      USINE_URL: ${USINE_URL:-}
      # Adresse https de l'écran « À valider » de l'usine : sans elle, le bouton « Proposer la semaine » du calendrier reste masqué.
      USINE_A_VALIDER_URL: ${USINE_A_VALIDER_URL:-}
      USINE_PORTE_SECRET: ${USINE_PORTE_SECRET:-}
      # Porte v2 (usine -> studio, /api/usine/*) : secret DIFFERENT de USINE_PORTE_SECRET, 32 caractères au moins, sinon la porte répond 404.
      # Le précédent n'est rempli que pendant une rotation, avec son échéance (date ISO avec Z ou décalage horaire, 24 h au plus dans le futur) ; sans échéance valide il est ignoré.
      STUDIO_PORTE_SECRET: ${STUDIO_PORTE_SECRET:-}
      STUDIO_PORTE_SECRET_PRECEDENT: ${STUDIO_PORTE_SECRET_PRECEDENT:-}
      STUDIO_PORTE_SECRET_PRECEDENT_JUSQU_A: ${STUDIO_PORTE_SECRET_PRECEDENT_JUSQU_A:-}
      # Vidéos sur le site (lots S3-S4) : vides = le site factice. Le vrai client n'est jamais choisi par défaut.
      SITE_VIDEOS_URL: ${SITE_VIDEOS_URL:-}
      SITE_VIDEOS_SECRET: ${SITE_VIDEOS_SECRET:-}
      # --- Lots A et B (02/10, docs/BRANCHEMENTS-EXECUTION.md) : posées par l'architecte, une fois pour toutes. ---
      # Lot A2 (M5) : illustrations réelles. Banques gratuites, puis fabrication payante à l'usage (fal.ai).
      FOURNISSEUR_ILLUSTRATION: ${FOURNISSEUR_ILLUSTRATION:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
      # Lot B1 : décors réalistes (Looks HeyGen). Vide = simulés (repli sur le décor du format, alerte).
      FOURNISSEUR_VISAGE: ${FOURNISSEUR_VISAGE:-}
      # Lot B2 : veille des outils. Vide = la veille lit les sources publiques sans jeton (limites de GitHub plus basses).
      STUDIO_VEILLE: ${STUDIO_VEILLE:-}
      GITHUB_TOKEN_VEILLE: ${GITHUB_TOKEN_VEILLE:-}
      # Claude (générateur de scripts, lot G0 → G6b) : la clé est posée en production. Elle ne dépense RIEN tant que Claude
      # n'est pas choisi : réglage « fournisseur.script » (Réglages > Connexions) ou FOURNISSEUR_SCRIPT=claude. Vide = essai.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Comptes Claude 2 et 3 (passage automatique d'un compte à l'autre quand l'un est épuisé) et API payante (4e source :
      # JAMAIS utilisée automatiquement, seulement par le choix manuel de Will dans Réglages). Vides = non utilisés.
      ANTHROPIC_API_KEY_2: ${ANTHROPIC_API_KEY_2:-}
      ANTHROPIC_API_KEY_3: ${ANTHROPIC_API_KEY_3:-}
      ANTHROPIC_API_KEY_PAYANTE: ${ANTHROPIC_API_KEY_PAYANTE:-}
      FOURNISSEUR_SCRIPT: ${FOURNISSEUR_SCRIPT:-}
      # Boucle d'écriture du générateur (toutes les 4 s). Vide = active ; « 0 » = COUPURE DE SECOURS (plus aucun appel Claude
      # ne part, les écritures restent où elles sont et reprennent quand on retire le 0).
      STUDIO_BOUCLE_GENERATION: ${STUDIO_BOUCLE_GENERATION:-}
      # Boucle de fond des fabrications (toutes les 5 s). Vide = active ; « 0 » = coupure de secours.
      STUDIO_BOUCLE: ${STUDIO_BOUCLE:-}
      # Délais de garde en minutes (vides = ceux du code) : rendu sans nouvelle, et garde globale d'un montage tableau.
      STUDIO_RENDU_SANS_NOUVELLE_MIN: ${STUDIO_RENDU_SANS_NOUVELLE_MIN:-}
      STUDIO_TABLEAU_GARDE_MIN: ${STUDIO_TABLEAU_GARDE_MIN:-}
      # Plafond de dépense fal.ai du processus, en dollars (facultatif ; vide = pas de plafond propre, le budget du studio reste).
      FAL_PLAFOND_USD: ${FAL_PLAFOND_USD:-}
      # --- Mesures (lot G7, « Mettre à jour les mesures ») : lecture seule. Vide = mode essai, rien n'est lu. ---
      # Plausible : clé de LECTURE des statistiques (visites par lien suivi). Adresse et site : défauts du code si vides
      # (https://plausible.axion-ia.com, axion-ia.com).
      PLAUSIBLE_KEY: ${PLAUSIBLE_KEY:-}
      PLAUSIBLE_URL: ${PLAUSIBLE_URL:-}
      PLAUSIBLE_SITE: ${PLAUSIBLE_SITE:-}
      # L'ancien outil (résilié) : clé gardée seulement pour lire l'historique ; aucun envoi, aucune publication. Vide : rien n'est lu.
      BUFFER_API_KEY: ${BUFFER_API_KEY:-}
      # Zernio : clé d'accès (lecture-écriture, un seul profil). Sans clé : aucun envoi par Zernio.
      ZERNIO_API_KEY: ${ZERNIO_API_KEY:-}
      # Parcours « mot en commentaire → e-mail → guide » : INERTE tant que les interrupteurs sont vides. Les secrets se posent sur le serveur par saisie masquée, jamais dans un dépôt.
      ZERNIO_WEBHOOK_SECRET: ${ZERNIO_WEBHOOK_SECRET:-}
      SITE_GUIDES_RESEAU_SECRET: ${SITE_GUIDES_RESEAU_SECRET:-}
      PARCOURS_MOT_ENABLED: ${PARCOURS_MOT_ENABLED:-}
      MOTS_ENABLED: ${MOTS_ENABLED:-}
      A_TRAITER_ENABLED: ${A_TRAITER_ENABLED:-}
      # Parcours « conversation » : INERTE tant que l'interrupteur est vide. Empreinte des personnes : secret de 32 caractères au moins, posé sur le serveur par saisie masquée ; les anciens (3 au plus, séparés par des virgules) ne servent qu'à reconnaître.
      PARCOURS_CONVERSATION_ENABLED: ${PARCOURS_CONVERSATION_ENABLED:-}
      # Comptes autorisés à ENVOYER (identifiants Zernio séparés par des virgules ; seuls les comptes Instagram et Facebook reliés comptent) et titre exact du guide inséré dans les messages. Vides = aucun envoi.
      PARCOURS_CONVERSATION_COMPTES: ${PARCOURS_CONVERSATION_COMPTES:-}
      PARCOURS_CONVERSATION_TITRE_GUIDE: ${PARCOURS_CONVERSATION_TITRE_GUIDE:-}
      STUDIO_EMPREINTE_SECRET: ${STUDIO_EMPREINTE_SECRET:-}
      STUDIO_EMPREINTE_SECRET_ANCIEN: ${STUDIO_EMPREINTE_SECRET_ANCIEN:-}
      # Lien de la page guide dans le 1er message privé : INERTE tant que l'interrupteur est vide. Le secret du lien doit avoir la même valeur que GUIDES_RESEAU_LIEN_SECRET côté site (posé par saisie masquée, jamais dans un dépôt). Comptes : « idCompteZernio=nom_court » séparés par des virgules.
      PARCOURS_LIEN_GUIDE: ${PARCOURS_LIEN_GUIDE:-}
      PARCOURS_ESSAI_COMPTES: ${PARCOURS_ESSAI_COMPTES:-}
      # Auteurs de commentaire admis sur une cible d'essai (3 au plus, séparés par des virgules). Vide = une cible d'essai n'est servie à personne.
      PARCOURS_ESSAI_AUTEURS: ${PARCOURS_ESSAI_AUTEURS:-}
      GUIDES_RESEAU_LIEN_SECRET: ${GUIDES_RESEAU_LIEN_SECRET:-}
      # Onglet « Guides » de /mots (rédaction, validation, PDF fabriqué par le site, rattachement au mot) : INERTE tant que vide.
      # Les deux doivent valoir exactement « true » : l'un montre l'onglet, l'autre autorise la rédaction (plafond mensuel inchangé).
      GUIDES_FABRIQUE_ECRAN: ${GUIDES_FABRIQUE_ECRAN:-}
      GUIDES_REDACTION_ENABLED: ${GUIDES_REDACTION_ENABLED:-}
      LIEN_GUIDE_COMPTES: ${LIEN_GUIDE_COMPTES:-}
      # Interrupteurs des oppositions (transmission par référence, import depuis le site) : INERTES tant que vides.
      OPPOSITIONS_PAR_REF_ENABLED: ${OPPOSITIONS_PAR_REF_ENABLED:-}
      OPPOSITIONS_SITE_IMPORT_ENABLED: ${OPPOSITIONS_SITE_IMPORT_ENABLED:-}
      # Message de remerciement après la page guide, et réduction des identifiants bruts après clôture : INERTES tant que vides.
      PARCOURS_MERCI_ENABLED: ${PARCOURS_MERCI_ENABLED:-}
      PARCOURS_REDUCTION_IDS: ${PARCOURS_REDUCTION_IDS:-}
      # Origine v3 des commentaires : éteinte (vide) ; préfixes de NOS comptes pour la garde post_url (vide = origine v3 refusée, corps v1).
      ORIGINE_V3_ENABLED: ${ORIGINE_V3_ENABLED:-}
      ORIGINE_V3_PREFIXES_COMPTES: ${ORIGINE_V3_PREFIXES_COMPTES:-}
      # Adresse publique du studio dans les e-mails de secours (vide = https://studio.axion-ia.com).
      STUDIO_ADRESSE: ${STUDIO_ADRESSE:-}
      # Point d'envoi ZeptoMail des e-mails de secours (vide = https://api.zeptomail.eu/v1.1/email).
      EMAIL_SECOURS_ADRESSE: ${EMAIL_SECOURS_ADRESSE:-}
      # Remotion Lambda (lot M4b) reste ÉTEINT : ses variables ne vont qu'à studio-rendu. Le jour où Will ouvre AWS, ajouter ici
      # aussi REMOTION_LAMBDA_ACTIVE/REGION/FONCTION/SITE et les clés AWS (le studio ne l'inscrit qu'avec toutes).
      # NE PAS transmettre (développement seulement, sans effet en production) : STUDIO_APERCU_MESURES, CREDITS_ESSAI,
      # STUDIO_SIMULATION_LENTEUR_MS, GOOGLE_DRIVE_ESSAI — voir deploiement/env.exemple.
      # --- Lot « intensité · crédits · calage » (02/10, docs/LOT-INTENSITE-CREDITS-EXECUTION.md) : posées par l'architecte. ---
      # Calage des sous-titres (D3) : vide = simulation (horodatage de la voix gardé). Réel : http://studio-aligneur:4200
      # (même clé partagée que studio-rendu : STUDIO_RENDU_CLE), puis FOURNISSEUR_ALIGNEMENT=studio-aligneur.
      STUDIO_ALIGNEUR_URL: ${STUDIO_ALIGNEUR_URL:-}
      FOURNISSEUR_ALIGNEMENT: ${FOURNISSEUR_ALIGNEMENT:-}
      # Crédits (D2) : solde réel d'ElevenLabs (voix de secours), lu seulement si la clé existe.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      # Lot E2 (import Google Drive, lecture seule) : vide = double de simulation. Réel : FOURNISSEUR_GOOGLE_DRIVE=google
      # + les deux clés OAuth. Voir docs/facecam/JOURNAL-E2.md.
      FOURNISSEUR_GOOGLE_DRIVE: ${FOURNISSEUR_GOOGLE_DRIVE:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECTION: ${GOOGLE_REDIRECTION:-}
      GOOGLE_DRIVE_COMPTE: ${GOOGLE_DRIVE_COMPTE:-}
      GOOGLE_DRIVE_CLE: ${GOOGLE_DRIVE_CLE:-}
      # Lot E1 (Décor IA, Higgsfield) : vides = double de simulation (aucun appel, aucun crédit). Le réel exige les DEUX
      # ET le réglage caché `facecam.decorIa.reel` ; l'option reste coupée par défaut. Voir docs/facecam/JOURNAL-E1.md.
      HIGGSFIELD_API_KEY: ${HIGGSFIELD_API_KEY:-}
      HIGGSFIELD_API_URL: ${HIGGSFIELD_API_URL:-}
    networks: [interne, coolify]
    # 3 Go (Will, 17/10) : secours en attendant le correctif de la mémoire native (malloc), cf. docs/memoire-native.
    mem_limit: 3g
    cpus: 2
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.studio-http.entrypoints=http
      - traefik.http.routers.studio-http.rule=Host(`studio.axion-ia.com`)
      - traefik.http.routers.studio-http.middlewares=studio-https
      - traefik.http.middlewares.studio-https.redirectscheme.scheme=https
      - traefik.http.routers.studio.entrypoints=https
      - traefik.http.routers.studio.rule=Host(`studio.axion-ia.com`)
      - traefik.http.routers.studio.tls=true
      - traefik.http.routers.studio.tls.certresolver=letsencrypt
      - traefik.http.services.studio.loadbalancer.server.port=3000

  # Conteneur SANS ÉTAT de rendu (lot M1b, B.9 ter) : FFmpeg, ffprobe, Remotion. Aucune base, aucun volume.
  # Réseau interne seulement ; priorité basse ; une file courte prioritaire et un seul montage à la fois.
  studio-rendu:
    build:
      context: ..
      dockerfile: deploiement/studio-rendu/Dockerfile
    image: studio-rendu:local
    restart: unless-stopped
    logging: *journaux
    stop_grace_period: 30s
    # Audit D : fichiers temporaires d'un rendu tué (manque de mémoire, SIGKILL). PAS de tmpfs ici : il compterait dans
    # la mémoire du conteneur (3 Go) alors qu'une entrée peut peser 4 Go. Les dossiers orphelins sont effacés au
    # DÉMARRAGE du service (`studio-rendu/src/nettoyage.ts`), avant tout rendu.
    environment:
      PORT: "4100"
      # Relecture sécurité R45 : clé OBLIGATOIRE (sans elle, refus de démarrer) ; seules les adresses du stockage R2 du
      # compte sont lues et écrites (hôte calculé comme le studio : R2_PUBLIC_HOST, sinon {R2_ACCOUNT_ID}.r2.cloudflarestorage.com).
      STUDIO_RENDU_CLE: ${STUDIO_RENDU_CLE:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_PUBLIC_HOST: ${R2_PUBLIC_HOST:-}
      STUDIO_RENDU_HOTES: ${STUDIO_RENDU_HOTES:-}
      # Pages du navigateur en parallèle : vide = automatique (la moitié des cœurs donnés ci-dessous, de 1 à 4, lot M4b).
      STUDIO_RENDU_CONCURRENCE: ${STUDIO_RENDU_CONCURRENCE:-}
      # Note VMAF de l'export (09/10, docs/JOURNAL-FFMPEG8-QUALITE.md) : seuil caché (vide = 93) ; « non » coupe la note.
      STUDIO_RENDU_VMAF_MIN: ${STUDIO_RENDU_VMAF_MIN:-}
      STUDIO_RENDU_VMAF: ${STUDIO_RENDU_VMAF:-}
      # Remotion Lambda (lot M4b) : ÉCRIT, ÉTEINT. Rien ne part chez AWS tant que REMOTION_LAMBDA_ACTIVE n'est pas « true ».
      REMOTION_LAMBDA_ACTIVE: ${REMOTION_LAMBDA_ACTIVE:-}
      REMOTION_LAMBDA_REGION: ${REMOTION_LAMBDA_REGION:-}
      REMOTION_LAMBDA_FONCTION: ${REMOTION_LAMBDA_FONCTION:-}
      REMOTION_LAMBDA_SITE: ${REMOTION_LAMBDA_SITE:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    networks: [interne]
    mem_limit: 3g
    # Vérif V5 : sans état et repris par le studio (même identifiant) : si la MACHINE manque de mémoire, le noyau tue ce
    # conteneur avant la base, le studio et le site axion-ia.com (0 par défaut).
    oom_score_adj: 500
    # Lot M4b : 6 cœurs au plus (45 s de vidéo ≈ 3 min par format, mesuré sur 6 fils ; ≈ 6,5 min avec 2). Le site
    # garde la main : poids processeur 4 fois plus faible que lui (`cpu_shares`) et `nice` dans l'image ; le rendu ne
    # prend donc que les cœurs laissés libres. Sur une machine plus petite, mettre-a-jour.sh règle STUDIO_RENDU_CPUS sur
    # le nombre de cœurs (sinon Docker refuserait de démarrer).
    cpus: ${STUDIO_RENDU_CPUS:-6}
    # Priorité basse face au studio (en plus de `nice` dans l'image) ; mémoire partagée du navigateur.
    cpu_shares: 256
    shm_size: 1g

  # Calage des sous-titres au mot près (lot « calage », D3, plan B.5) : WhisperX (modèle wav2vec2 français) sur le
  # processeur, SANS ÉTAT. Réseau interne seulement ; une demande à la fois ; priorité basse. Le studio l'appelle par
  # STUDIO_ALIGNEUR_URL=http://studio-aligneur:4200 puis FOURNISSEUR_ALIGNEMENT=studio-aligneur (vide : calage sauté,
  # horodatage de la voix gardé). Même clé partagée que studio-rendu. Lot R6 : il cale les PRISES FILMÉES (« je lis ») ;
  # la voix de synthèse garde son horodatage (plus juste, mesure D3), sauf réglage « alignement.voixSynthese ».
  # Image estimée ≈ 2 Go (Python 3.11 + FFmpeg + PyTorch processeur + modèle 360 Mo) ; prévoir ≥ 6 Go de disque libre.
  # Profil « calage » : NI construit NI démarré tant qu'il n'est pas activé (le modèle chargé garde ≈ 1 Go de mémoire
  # au repos). mettre-a-jour.sh l'active de lui-même quand STUDIO_ALIGNEUR_URL est renseignée dans le .env.
  studio-aligneur:
    profiles: [calage]
    build:
      context: ..
      dockerfile: deploiement/studio-aligneur/Dockerfile
    image: studio-aligneur:local
    restart: unless-stopped
    logging: *journaux
    stop_grace_period: 30s
    environment:
      PORT: "4200"
      # Lot R6 : clé obligatoire — le serveur refuse de démarrer sans elle (aligneur/__main__.py).
      STUDIO_RENDU_CLE: ${STUDIO_RENDU_CLE:-}
      STUDIO_ALIGNEUR_FILS: "2"
      # Audit D : délai maximal d'un calcul (secondes ; vide = 900). Au-delà : échec typé, file libérée, /sante en 503
      # tant que le calcul figé occupe le processus.
      STUDIO_ALIGNEUR_DELAI_SEC: ${STUDIO_ALIGNEUR_DELAI_SEC:-}
      # Vérif V5 : travaux face caméra (état JSON + tranches de 30 s) dans un VOLUME : une recréation du conteneur
      # (mise à jour, retour arrière) les reprend où ils en étaient au lieu de tout recalculer. Les travaux finis sont
      # oubliés au bout de 24 h, les fichiers lourds d'un travail fini ou raté sont effacés tout de suite.
      STUDIO_ALIGNEUR_TRAVAUX: /app/travaux
    volumes:
      - travaux-aligneur:/app/travaux
    networks: [interne]
    # Mesuré : ≈ 1,7 Go au plus pour le calage (modèle chargé ≈ 0,95 Go + un morceau de 25 s de son). Plan facecam v4
    # n° 6 : 3,5 Go (Whisper small int8 + passe image par tranches de 30 s ; un seul travail lourd à la fois). 09/10 :
    # 4,5 Go — mesuré en production, pic de 3,23 Go sur 3,42 Go utilisables pendant la passe image d'une vidéo de 2 min
    # (marge trop mince) ; le serveur a 15 Go. 10/10 (vérif V5) : 6000m — 4,40 Go atteints pour 4,395 pendant la passe
    # « formats » (bande élargie au 4:5 depuis la source 4K, relevé à chaud à 6 Go en production). Un seul calcul lourd à
    # la fois dans le conteneur (calage OU travail face caméra, verrou commun). Le code borne désormais les fils de
    # FFmpeg / x264 à STUDIO_ALIGNEUR_FILS (banc 4K pleine largeur : pic 5,1 Go → 3,6 Go, docs/facecam/
    # JOURNAL-FICHE-CARTES-FORMATS.md). Pic connu = 73 % de 6000m ; surveiller.sh alerte à 85 %.
    # BUDGET DU SERVEUR (15 Go, partagé avec le site) : base 0,5 + studio 1 + studio-rendu 3 + studio-aligneur 5,86
    # = 10,4 Go au plus pour le studio ; ≥ 4,6 Go restent au site axion-ia.com, à Coolify/Traefik et au système.
    mem_limit: 6000m
    oom_score_adj: 500
    cpus: 2
    cpu_shares: 256

  # Poste de capture figé du tutoriel d'outil (T-EXT-51b/51c) : Chromium + FFmpeg, SANS RÉSEAU. LIVRÉ INACTIF : profil
  # « capture » = NI construit NI démarré par `docker compose up`/`build`, ni par mettre-a-jour.sh (qui ne le nomme pas).
  # Obligatoire avant d'accepter un dossier (.zip) de client (T-EXT-41, T-EXT-29). Déclenchement À LA MAIN seulement,
  # depuis deploiement/ ; n'utiliser que ces commandes : JAMAIS `--entrypoint`, `-v`/`--volume`, `-e`/`--env` (ils
  # contournent le `timeout`, les montages fermés et le choix du Chromium). Le point d'entrée est lancer.sh.
  #
  # PRÉPARATION CÔTÉ SERVEUR (une fois, AVANT le premier lancement ; sinon docker crée les dossiers en root:root et la
  # capture échoue en EACCES). Les dossiers sont HORS du dépôt cloné (fichiers de clients : jamais dans le contexte de
  # construction ni dans git) ; UID 1001 = `pwuser`, l'utilisateur de l'image (vérifié : `docker run --rm --entrypoint id
  # <image> pwuser` donne uid=1001) :
  #   sudo mkdir -p /opt/studio-axion-ia/capture-entree /opt/studio-axion-ia/capture-sortie
  #   (capture-entree : scenario.json + calage.json, lisibles par 1001, montés en lecture seule)
  # /sortie BORNÉE (obligatoire : lancer.sh REFUSE de démarrer, code 64, si /sortie n'est pas un point de montage, et,
  # code 65, si sa taille totale dépasse 4 Gio ; le disque du serveur est partagé avec Postgres et les médias). Procédure :
  # un système de fichiers en boucle DÉDIÉ de 3 Gio, ni exécutable ni à droits spéciaux, monté sur capture-sortie :
  #   sudo fallocate -l 3G /opt/studio-axion-ia/capture-sortie.img && sudo mkfs.ext4 -q -m 0 /opt/studio-axion-ia/capture-sortie.img
  #   echo '/opt/studio-axion-ia/capture-sortie.img /opt/studio-axion-ia/capture-sortie ext4 loop,nodev,nosuid,noexec 0 0' | sudo tee -a /etc/fstab
  #   sudo mount /opt/studio-axion-ia/capture-sortie && sudo chown 1001:1001 /opt/studio-axion-ia/capture-sortie
  # (ce fichier .img occupe 3 Gio de disque, pas de mémoire vive). Autres emplacements : STUDIO_CAPTURE_ENTREE et
  # STUDIO_CAPTURE_SORTIE (mêmes droits, même borne). Variables NON obligatoires (`:?` casserait l'analyse du compose
  # entier, donc `up` en production) : les défauts sont hors dépôt.
  #   docker compose --profile capture build studio-capture
  # Capture (mode « capturer », par défaut) : lancer par la forme LANCER ci-dessous, avec ces <arguments du mode> :
  #     --maquette outils/maquettes-tableaux-de-bord/maquette --scenario /entree/scenario.json --calage /entree/calage.json --sortie /sortie
  # (sans --calage, seule la passe de contrôles tourne : pas de navigation.mp4).
  # LANCER (toujours ainsi, capturer ou decompresser) : avec `-d`, l'échéance côté hôte tue VRAIMENT le conteneur (tuer
  # seulement le client `docker compose run` ne lui transmet aucun signal : il continuerait de tourner et garderait /sortie
  # monté en écriture). Avec `-d`, il n'y a plus de `--rm` : le `docker rm -f` final le remplace. <id> = un nom unique :
  #   docker compose --profile capture run -d --name studio-capture-<id> studio-capture <arguments du mode>
  #   timeout 960 docker wait studio-capture-<id> || docker kill studio-capture-<id>
  #   docker logs studio-capture-<id> ; docker rm -f studio-capture-<id>
  # (960 s = 900 s du `timeout` de lancer.sh + sa marge de 30 s + 30 s.) Les <arguments du mode> sont ceux de la commande de
  # capture ci-dessus (`--maquette … --sortie /sortie`) ou de décompression ci-dessous.
  # DÉCOMPRESSION d'un .zip client : dans CE conteneur (même service, même durcissement), jamais sur l'hôte. Le zip est
  # posé dans capture-entree (monté en lecture seule sur /entree), la sortie va dans /sortie (bornée) ; les options
  # exactes sont celles de outils/maquettes-tableaux-de-bord/capture/decompresser.mts (lot « zip »). <arguments du mode> :
  #   decompresser --zip /entree/<fichier>.zip --sortie /sortie/maquette
  # (--sortie est un SOUS-DOSSIER, /sortie/maquette : la racine d'un ext4 contient lost+found, donc n'est jamais vide, et un
  # point de montage ne se renomme pas.)
  # PROCÉDURE CÔTÉ HÔTE, dans cet ordre, pour CHAQUE client. Un Chromium compromis peut poser des liens symboliques dans
  # /sortie, et docker SUIT sur l'hôte un lien placé dans la source d'un montage (essai réel : un lien vers un dossier
  # contenant .env a donné son contenu au conteneur) :
  #  1. AUCUN conteneur ne doit tourner : `docker ps --filter name=studio-capture` doit être VIDE (sinon ARRÊT : ne rien faire),
  #     ET `docker ps --filter label=com.docker.compose.service=studio-capture` doit être VIDE (sinon ARRÊT : ne rien faire).
  #     OBLIGATOIRE : `umount` (étape 2) RÉUSSIT même si un conteneur garde /sortie ouvert (le montage disparaît de l'hôte, pas du conteneur) ;
  #     sans ce contrôle, un conteneur resté en vie pourrait encore écrire dans l'ancien /sortie.
  #  2. Un /sortie NEUF POUR CHAQUE CLIENT (jamais de décompression et de capture en même temps sur le même /sortie) :
  #       sudo umount /opt/studio-axion-ia/capture-sortie
  #       sudo rm -f /opt/studio-axion-ia/capture-sortie.img && sudo fallocate -l 3G /opt/studio-axion-ia/capture-sortie.img
  #       sudo mkfs.ext4 -q -m 0 /opt/studio-axion-ia/capture-sortie.img
  #       sudo mount -o loop,nodev,nosuid,noexec /opt/studio-axion-ia/capture-sortie.img /opt/studio-axion-ia/capture-sortie
  #       sudo chown 1001:1001 /opt/studio-axion-ia/capture-sortie
  #  3. Décompresser (commande ci-dessus), puis refaire l'étape 1 (le conteneur est supprimé).
  #  4. CONTRÔLER LA SOURCE, puis COPIER la maquette décompressée HORS de capture-sortie, vers un dossier de root que le conteneur
  #     ne monte pas. Chaque commande se copie telle quelle ; au moindre écart : ARRÊT, ne rien monter.
  #     Critère 1 : la source ne contient que des fichiers et des dossiers, cette commande doit afficher RIEN (liens, FIFO, sockets, périphériques) :
  #       sudo find /opt/studio-axion-ia/capture-sortie/maquette ! -type f ! -type d
  #     Critère 2 : le chemin réel doit être ÉGAL au chemin exact écrit (aucun lien, ni sur `maquette`, ni sur `<dossier>`) :
  #       sudo realpath -e /opt/studio-axion-ia/capture-sortie/maquette/<dossier>
  #     Critère 3 : <id> doit être NEUF (ni fichier, ni dossier, ni lien, même cassé ; cette commande doit réussir) :
  #       sudo mkdir -p /opt/studio-axion-ia/capture-maquettes && test ! -e /opt/studio-axion-ia/capture-maquettes/<id> && test ! -L /opt/studio-axion-ia/capture-maquettes/<id>
  #     Copier (ou `rsync --no-links` à la place de `cp`), donner la copie à root :
  #       sudo cp -r --no-dereference /opt/studio-axion-ia/capture-sortie/maquette/<dossier> /opt/studio-axion-ia/capture-maquettes/<id>
  #       sudo chown -R root:root /opt/studio-axion-ia/capture-maquettes/<id> && sudo chmod -R a+rX,go-w /opt/studio-axion-ia/capture-maquettes/<id>
  #     Critère 4 : CONTRÔLER LA COPIE de la même façon, cette commande doit afficher RIEN, et le chemin réel doit être ÉGAL au chemin écrit :
  #       sudo find /opt/studio-axion-ia/capture-maquettes/<id> ! -type f ! -type d
  #       sudo realpath -e /opt/studio-axion-ia/capture-maquettes/<id>
  #  5. Refaire l'étape 2 (un /sortie neuf pour la capture), puis, JUSTE AVANT de lancer, refaire le contrôle `docker ps` de l'étape 1
  #     (par nom ET par label, VIDES, sinon ARRÊT), puis capturer en montant la COPIE contrôlée :
  #       STUDIO_CAPTURE_MAQUETTE=/opt/studio-axion-ia/capture-maquettes/<id> docker compose --profile capture run -d --name studio-capture-<id> studio-capture …
  # Le film sort dans /sortie ; l'envoi au stockage reste au Studio, qui doit traiter /sortie comme HOSTILE (liens
  # symboliques, fichiers énormes : lstat, O_NOFOLLOW, liste fermée de noms, taille maximale, ffprobe en conteneur).
  # Entrées : STUDIO_CAPTURE_MAQUETTE (dossier d'une maquette, défaut 03-accueil-24h : uniquement le dossier décompressé
  # et contrôlé). Inscriptible : /sortie (bornée), un tmpfs /tmp de 256 Mo et un tmpfs /dev/shm de 512 Mo (Chromium),
  # tous deux noexec,nosuid,nodev ; rien d'autre. Durée : 15 min (capturer) ou 5 min (decompresser), SIGKILL 30 s après, `timeout` de
  # lancer.sh ; aucun secret, aucun port.
  # ISOLATION : le bac à sable de Chromium est DÉSACTIVÉ (Playwright 1.63 passe --no-sandbox si chromiumSandbox n'est
  # pas true) : SEUL ce conteneur isole Chromium. Pour cela, NE JAMAIS ajouter : privileged, cap_add, devices, ipc/pid/
  # userns_mode host, seccomp:unconfined, apparmor:unconfined, systempaths=unconfined, montage de docker.sock, de /var/run,
  # de /opt/studio-axion-ia (hors capture-*) ou d'un .env, ni `--no-sandbox` ajouté à la main (tests/deploiement/studio-capture.test.ts).
  studio-capture:
    profiles: [capture]
    build:
      context: ..
      dockerfile: deploiement/studio-capture/Dockerfile
    image: studio-capture:local
    restart: "no"
    network_mode: none
    read_only: true
    init: false
    # `init: false` ÉCRIT EN CLAIR (jamais `init: true`, jamais la clé absente : sans clé, le démon applique SA valeur par
    # défaut, et `"init": true` dans daemon.json ou `dockerd --init` remettrait un autre PID 1 que `timeout`).
    # PAS d'`init: true` (changement de garde VOULU par l'audit de #1611) : sans init, lancer.sh fait `exec timeout ...`,
    # donc `timeout` est le PID 1 du conteneur, et le noyau IGNORE tout SIGSTOP envoyé à un PID 1 depuis l'intérieur de
    # son espace de noms (preuve réelle : `kill -STOP 1` est sans effet et le conteneur s'arrête à l'échéance, code 124).
    # Avec `init: true`, `timeout` n'était pas PID 1 et tournait sous le même uid 1001 que Chromium : un Chromium compromis
    # le gelait par `kill -STOP <pid>` et échappait à la durée bornée (essai : encore vivant à 12 s pour `timeout 5`).
    # Contrepartie acceptée : les zombies ne sont plus récupérés, ils restent bornés par `pids: 512`.
    # Journaux Docker BORNÉS, écrits en clair (pas d'ancre : le test les interdit dans ce service) : sans cela un
    # processus du conteneur pouvait écrire ~1 Go de journal en 12 s sur le disque du serveur (audit de #1611).
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # UN SEUL uid : celui de `pwuser` dans l'image (Dockerfile : USER 1001:1001, contrôlé à la construction).
    user: "1001:1001"
    cap_drop: [ALL]
    # seccomp : le profil par défaut de Docker (v29.10.0) à l'IDENTIQUE, SAUF `ptrace`, `process_vm_readv` et
    # `process_vm_writev` retirés (plus strict, jamais plus large) : sans cela, un processus du conteneur (même uid 1001 que
    # `timeout`, PID 1) le gelait par PTRACE_SEIZE + PTRACE_INTERRUPT et échappait à la durée bornée. Référence :
    # https://github.com/moby/moby/blob/docker-v29.10.0/vendor/github.com/moby/profiles/seccomp/default.json (commit 06db173,
    # sha256 6416b47770785a41ac59073cdc77d9fe98517df2799dc83ef207e622de3053f6) ; le test reconstruit cette référence. Chemin
    # relatif AU FICHIER COMPOSE. Changer de version de Docker : reprendre le profil au nouveau tag, mêmes 3 retraits.
    # DURÉE : seul le `docker kill` de l'HÔTE (procédure LANCER ci-dessus) la GARANTIT. `init: false`, seccomp sans ptrace et
    # `timeout` en 0711 dans l'image (Dockerfile : non lisible, donc non dumpable : pas de /proc/1/mem) ne font que la rendre
    # plus difficile à contourner pour un processus du conteneur.
    security_opt:
      - no-new-privileges:true
      - seccomp=./studio-capture/seccomp.json
    # Limite de mémoire par `deploy.resources.limits` (et non `mem_limit`) : le budget mémoire du serveur
    # (tests/v5-serveur-scripts.test.ts) ne compte que les services qui tournent en permanence ; celui-ci est inactif.
    deploy:
      resources:
        limits:
          memory: 2g
          pids: 512
          # CPU bornée (comme studio-rendu/studio-aligneur) : 2 cœurs au plus ; ici et non `cpus:` (compose refuse les deux).
          cpus: "2"
    cpu_shares: 256
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
      - /dev/shm:size=512m,mode=1777,noexec,nosuid,nodev
    volumes:
      - ${STUDIO_CAPTURE_MAQUETTE:-../outils/maquettes-tableaux-de-bord/03-accueil-24h}:/app/outils/maquettes-tableaux-de-bord/maquette:ro
      - ../outils/maquettes-tableaux-de-bord/charte:/app/outils/maquettes-tableaux-de-bord/charte:ro
      - ${STUDIO_CAPTURE_ENTREE:-/opt/studio-axion-ia/capture-entree}:/entree:ro
      - ${STUDIO_CAPTURE_SORTIE:-/opt/studio-axion-ia/capture-sortie}:/sortie

volumes:
  donnees:
  # Travaux face caméra de studio-aligneur (fichiers de travail, jamais des données : rien d'irremplaçable).
  travaux-aligneur:

networks:
  interne:
  coolify:
    external: true
