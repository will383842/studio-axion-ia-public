lor:var(--blanc)}.weekday{font-weight:800;color:var(--texte-secondaire);text-align:center;font-size:11px;padding-bottom:7px}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.flowstep{padding:16px;border:1px solid var(--line);border-radius:13px;background:var(--blanc)}.flowstep.done{border-color:var(--reussite);background:var(--ivoire)}.flowstep strong{display:block;margin:5px 0}.flowstep span{font-size:11px;color:var(--texte-secondaire)}.illustration{background:var(--noir);color:var(--ivoire);border-radius:15px;padding:24px;position:relative;min-height:160px;overflow:hidden}.illustration .eyebrow{color:var(--orange)}.illustration:before{content:'❀';position:absolute;font-size:160px;color:var(--gris-sur-noir);opacity:.2;right:15px;top:-55px}.illustration h2{font:700 24px/1.2 "Manrope",sans-serif;max-width:310px;margin:6px 0 12px;position:relative}.illustration p{max-width:360px;color:var(--gris-sur-noir);position:relative}.statsbar{height:11px;border-radius:9px;background:var(--gris);overflow:hidden;margin-top:9px}.statsbar>div{height:100%;background:var(--terracotta);border-radius:9px;transition:width .3s}.bars{height:180px;display:flex;align-items:end;gap:17px;margin-top:26px}.bars>div{flex:1;text-align:center;color:var(--texte-secondaire);font-size:11px}.bars b{display:block;border-radius:7px 7px 0 0;background:var(--terracotta);margin-bottom:9px}.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.kanban-col{background:var(--gris);border-radius:14px;padding:14px}.kanban-col h3{margin:2px 0 15px;font-size:13px}.candidate{background:var(--blanc);border:1px solid var(--line);padding:15px;border-radius:12px;margin-bottom:10px}.candidate strong{display:block}.candidate small{color:var(--muted)}.docgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.doc{padding:18px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:.2s}.doc:hover{background:var(--ivoire)}.doc .symbol{font-size:27px}.doc strong{display:block;margin-top:12px}.doc small{color:var(--muted)}.checkrow{display:flex;justify-content:space-between;align-items:center;padding:15px;border-bottom:1px solid var(--line)}.checkrow label{display:flex;gap:11px;align-items:center}.checkrow input{accent-color:var(--terracotta);width:16px;height:16px}.chat{height:270px;overflow:auto;background:var(--ivoire);border-radius:12px;padding:16px;margin-bottom:13px}.bubble{max-width:86%;padding:11px 14px;background:var(--gris);border-radius:12px 12px 12px 3px;margin-bottom:12px}.bubble.user{margin-left:auto;background:var(--noir);color:var(--ivoire);border-radius:12px 12px 3px 12px}.dialogoverlay{position:fixed;inset:0;background:#14141399;display:none;place-items:center;padding:20px;z-index:10}.dialogoverlay.show{display:grid}.dialog{width:min(490px,100%);background:var(--blanc);border-radius:19px;padding:25px}.dialog h2{font:700 24px "Manrope",sans-serif;margin:0 0 8px}.dialog label{display:block;font-size:12px;color:var(--texte-secondaire);font-weight:750;margin:16px 0 5px}.dialog .field{width:100%}.dialog .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.toast{position:fixed;bottom:28px;right:27px;background:var(--noir);color:var(--blanc);padding:13px 20px;border-radius:12px;z-index:15;display:none}.toast.show{display:block}.demo{position:fixed;bottom:23px;left:270px;right:25px;background:var(--noir);color:var(--blanc);border-radius:15px;display:none;align-items:center;justify-content:space-between;gap:15px;padding:14px 19px;z-index:9}.demo.show{display:flex}.demo small{color:var(--gris-sur-noir)}.demo .button{border-color:var(--orange)}.smalllink{border:0;background:transparent;color:var(--terracotta);font-weight:800;padding:5px}.smalllink:hover{text-decoration:underline}.pillcount{display:inline-grid;place-items:center;background:var(--ivoire);border-radius:99px;min-width:19px;height:19px;font-size:10px;margin-left:auto}.hint{background:var(--ivoire);border:1px dashed var(--terraco </style></head><body><div class="mention-demo">Démonstration · données fictives</div><div class="app"><aside class="sidebar"><div class="brand"><span class="brand-icon">✳</span> Espace démo · Équipe</div><div class="mini">Espace de travail</div><nav id="nav"></nav><div class="sidebottom"><div class="mini">Entreprise</div><div class="profile"><div class="avatar">CL</div><div><strong>Camille Laurent</strong><small>Administration RH</small></div></div></div></aside><main class="main"><header class="top"><div><div class="eyebrow">Entreprise exemple <span style="color:var(--texte-secondaire)">/</span> Espace RH</div></div><div class="top-right"><span class="chip">● DONNÉES EXEMPLE</span><button class="button ghost" onclick="resetAll()" title="Repartir des données de départ">↺ Réinitialiser</button><button class="button primary" onclick="startDemo()">▶ Mode démo</button></div></header><div id="pages"></div></main></div><div id="modal" class="dialogoverlay" onclick="if(event.target===this)closeModal()"><div class="dialog" id="dialog"></div></div><div class="toast" id="toast"></div><div class="demo" id="demobar"><div><small id="demoCount">ÉTAPE 1 / 4</small><div id="demoText" style="font-weight:700">Démonstration</div></div><div style="display:flex;gap:8px;align-items:center"><button class="button" onclick="nextDemo()" id="demoNext">Suivant →</button><button class="button ghost" style="color:white" onclick="endDemo()">✕ Fermer</button></div></div><script>
const menu=[['home','⌂','Accueil'],['employees','♧','Collaborateurs'],['absences','◷','Absences'],['leave','☼','Congés'],['recruit','◇','Recrutement'],['candidates','♧','Candidatures'],['onboard','▧','Onboarding'],['docs','▤','Documents RH'],['ai','✧','Assistant IA'],['stats','▥','Statistiques']];
const people=[['EL','Emma Lefèvre','Marketing','Responsable marketing'],['TM','Thomas Martin','Commercial','Business developer'],['SD','Sarah Dubois','Administration','Chargée administrative'],['LB','Lucas Bernard','Produit','Designer produit'],['JP','Julie Petit','Direction','Responsable opérations'],['AK','Adam Khelifi','Commercial','Chargé de clientèle'],['CM','Chloé Moreau','Produit','Chef de projet'],['NL','Nina Laurent','Marketing','Chargée de communication']];
const base=()=>({requests:[{id:1,name:'Sarah Dubois',start:'2026-11-19',end:'2026-11-20',days:2,status:'Validée',type:'Congés payés'},{id:2,name:'Thomas Martin',start:'2026-11-24',end:'2026-11-25',days:2,status:'En attente',type:'Congés payés'}],employees:[...people],candidates:[{name:'Léa Bernard',role:'Chargé(e) de communication',stage:'À étudier'},{name:'Hugo Perrin',role:'Business developer',stage:'Entretien'},{name:'Manon Roux',role:'Designer produit',stage:'Finaliste'}],tasks:[false,false,true,false,false],docs:['Modèle de contrat de travail','Livret d’accueil','Politique de congés','Charte informatique','Note de frais'],assistant:[],roles:['Chargé(e) de communication','Business developer'],step:0});
let state;try{state=JSON.parse(sessionStorage.getItem('equipe-demo-v1'))||base()}catch{state=base()}let current='home',filter='Toutes',search='',demoStep=-1;const save=()=>{try{sessionStorage.setItem('equipe-demo-v1',JSON.stringify(state))}catch(e){/* stockage indisponible : état maintenu en mémoire */}};
const safe=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));const person=(n,role='')=>`<div class="person"><div class="avatar">${safe(n.split(' ').map(s=>s[0]).slice(0,2).join(''))}</div><div><strong>${safe(n)}</strong><small>${safe(role)}</small></div></div>`;const status=s=>`<span class="tag ${s==='En attente'?'pending':s==='Refusée'?'refused':''}">${safe(s)}</span>`;
const head=(title,subtitle,button='')=>`<div class="heading"><div><div class="eyebrow">Gestion des ressources humaines</div><h1>${title}</h1><p>${subtitle}</p></div>${button}</div>`;
const btn=(text,action,cl='')=>`<button class="button ${cl}" onclick="${action}">${text}</button>`;
const card=(title,content,sub='')=>`<div class="card"><div class="card-title">${title}</div>${sub?`<div class="card-sub">${sub}</div>`:''}${content}</div>`;
const requestTable=(rows,approval=false)=>`<div class="tablewrap"><table class="table"><thead><tr><th>Collaborateur</th><th>Dates</th><th>Durée</th><th>Statut</th>${approval?'<th>Décision</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr><td>${person(r.name,r.type)}</td><td>${safe(r.start)} → ${safe(r.end)}</td><td>${r.days} j</td><td>${status(r.status)}</td>${approval?`<td>${r.status==='En attente'?`${btn('✓ Valider',`decide(${r.id},'Validée')`)} ${btn('Refuser',`decide(${r.id},'Refusée')`,'warn')}`:'<span class="muted">Décision prise</span>'}</td>`:''}</tr>`).join('')||'<tr><td colspan="5" class="center muted">Aucune demande pour ce filtre.</td></tr>'}</tbody></table></div>`;
function calendar(){let cells=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(d=>`<div class="weekday">${d}</div>`).join('');const first=(new Date(2026,10,1).getDay()+6)%7;for(let i=0;i<first;i++)cells+='<div></div>';for(let d=1;d<=30;d++){const date=`2026-11-${String(d).padStart(2,'0')}`;let approved=state.requests.filter(r=>r.status==='Validée'&&date>=r.start&&date<=r.end),pending=state.requests.filter(r=>r.status==='En attente'&&date>=r.start&&date<=r.end);let r=approved[0]||pending[0];cells+=`<div class="day ${approved.length?'holiday':pending.length?'pending':''}"><div class="num">${d}</div>${r?`<div class="note">${approved.length?'●':'◌'} ${safe(r.name.split(' ')[0])}</div>`:''}</div>`}return `<div class="calendar">${cells}</div><div class="placeholder" style="margin-top:13px">● Plein : congé validé &nbsp;&nbsp; ◌ Pointillé : en attente · Novembre 2026 · données exemple</div>`}
function render(){document.getElementById('nav').innerHTML=menu.map(([id,ico,title],i)=>`${i===4?'<div class="mini">Talents & organisation</div>':''}<button class="nav ${current===id?'active':''}" onclick="go('${id}')"><span class="ico">${ico}</span><span class="name">${title}</span>${id==='leave'?`<span class="pillcount">${state.requests.filter(r=>r.status==='En attente').length}</span>`:''}</button>`).join('');const pending=state.requests.filter(r=>r.status==='En attente').length,approved=state.requests.filter(r=>r.status==='Validée').length;
const pages={
home:head('Bonjour Camille,','Voici ce qui se passe dans votre entreprise aujourd’hui.',btn('+ Nouvelle demande',"openLeave()",'primary'))+`<div class="grid metrics">${[['Collaborateurs',state.employees.length,'Équipe active · exemple'],['Demandes à valider',pending,'Action requise'],['Congés validés',approved,'Mois en cours'],['Postes ouverts',state.roles.length,'Recrutement en cours']].map(([l,v,sub])=>`<div class="card"><div class="metric-label">${l}</div><div class="metric-value">${v.toString().padStart(2,'0')}</div><div class="delta">${sub}</div></div>`).join('')}</div><div class="grid two"><div>${card('Demandes récentes',requestTable(state.requests.slice().reverse(),true),'Toutes les demandes de congés à suivre')}<div class="sectiongap">${card('Planning des congés',calendar(),'Vue collective de novembre 2026')}</div></div><div>${card('Votre RH, plus sereinement',`<div class="illustration"><div class="eyebrow">Bienvenue dans l’espace démo</div><h2>Une équipe qui grandit, sans complexité.</h2><p>Vos demandes, collaborateurs et documents au même endroit.</p></div><div style="margin-top:14px">${btn('Découvrir le parcours démo →','startDemo()','primary')}</div>`)}<div class="sectiongap">${card('À ne pas oublier',`<div class="checkrow">${pending} demande(s) de congé à traiter ${btn('Voir →',"go('leave')")}</div><div class="checkrow">${state.tasks.filter(x=>!x).length} étape(s) d’intégration restantes ${btn('Voir →',"go('onboard')")}</div>`)}</div></div></div>`,
employees:head('Collaborateurs','Vos talents, vos équipes, au même endroit.',btn('+ Ajouter un collaborateur','openEmployee()','primary'))+card('Annuaire de l’équipe',`<div class="searchline"><input class="field" placeholder="Rechercher un nom, un poste, une équipe…" oninput="employeeSearch(this)" value="${safe(search)}"><select class="field" onchange="filter=this.value;render()"><option ${filter==='Toutes'?'selected':''}>Toutes</option>${['Marketing','Commercial','Administration','Produit','Direction'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="tablewrap"><table class="table"><thead><tr><th>Nom</th><th>Équipe</th><th>Poste</th><th>Fiche</th></tr></thead><tbody>${state.employees.filter(p=>(filter==='Toutes'||p[2]===filter)&&p.join(' ').toLowerCase().includes(search.toLowerCase())).map(p=>`<tr><td>${person(p[1],p[3])}</td><td>${safe(p[2])}</td><td>${safe(p[3])}</td><td><button class="smalllink" onclick="detail('${safe(p[0])}')">Voir la fiche →</button></td></tr>`).join('')||'<tr><td colspan="4">Aucun résultat.</td></tr>'}</tbody></table></div>`),
absences:head('Absences','Un suivi clair des présences et des indisponibilités.',btn('+ Signaler une absence','openAbsence()','primary'))+`<div class="grid metrics"><div class="card"><div class="metric-label">Absences signalées</div><div class="metric-value">${state.requests.filter(x=>x.type==='Absence').length}</div></div><div class="card"><div class="metric-label">Congés approuvés</div><div class="metric-value">${approved}</div></div></div><div class="sectiongap">${card('Absences et indisponibilités',requestTable(state.requests.filter(r=>r.type==='Absence'||r.status==='Validée')),'Données internes fictives')}</div>`,
leave:head('Congés & planning','De la demande à la validation, sans aller-retour inutile.',btn('+ Demander un congé','openLeave()','primary'))+`<div class="flow"><div class="flowstep ${state.requests.some(r=>r.name==='Emma Lefèvre')?'done':''}"><span>01 — COLLABORATEUR</span><strong>Faire une demande</strong>La demande apparaît dans le suivi</div><div class="flowstep ${state.requests.some(r=>r.name==='Emma Lefèvre'&&r.status==='Validée')?'done':''}"><span>02 — RESPONSABLE</span><strong>Valider ou refuser</strong>La décision reste humaine</div><div class="flowstep ${state.requests.some(r=>r.name==='Emma Lefèvre'&&r.status==='Validée')?'done':''}"><span>03 — PLANNING</span><strong>Mettre à jour la vue</strong>Le planning reflète la décision</div></div><div class="grid two"><div>${card('Demandes de congés',`<div class="searchline"><select class="field" onchange="filter=this.value;render()">${['Toutes','En attente','Validée','Refusée'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select></div>${requestTable(state.requests.filter(r=>r.type!=='Absence'&&(filter==='Toutes'||!['En attente','Validée','Refusée'].includes(filter)||r.status===filter)),true)}`)}</div><div>${card('Planning partagé · Novembre 2026',calendar(),'La validation met à jour les jours pleins immédiatement')}</div></div>`,
recruit:head('Recrutement','Suivez vos recrutements sans perdre le fil.',btn('+ Créer une offre','openRole()','primary'))+card('Offres en cours',`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${state.roles.map(role=>`<div class="doc"><div class="symbol">◇</div><strong>${safe(role)}</strong><small>Offre active · Entreprise exemple</small><div style="margin-top:16px">${btn('Voir les candidatures',"go('candidates')")}</div></div>`).join('')}</div>`),
candidates:head('Candidatures','Chaque candidature, au bon stade.',btn('+ Ajouter une candidature','openCandidate()','primary'))+`<div class="kanban">${['À étudier','Entretien','Finaliste'].map(stage=>`<div class="kanban-col"><h3>${stage} <span class="pillcount">${state.candidates.filter(c=>c.stage===stage).length}</span></h3>${state.candidates.filter(c=>c.stage===stage).map(c=>`<div class="candidate"><strong>${safe(c.name)}</strong><small>${safe(c.role)}</small><div style="margin-top:12px">${stage!=='Finaliste'?btn('Étape suivante →',`moveCandidate('${safe(c.name)}')`):'<span class="tag">Finaliste</span>'}</div></div>`).join('')||'<div class="placeholder">Aucun candidat</div>'}</div>`).join('')}</div>`,
onboard:head('Onboarding','Un parcours d’arrivée structuré pour chaque recrue.',btn('Réinitialiser la checklist','resetTasks()'))+`<div class="grid two"><div>${card('Parcours d’intégration · Léa Bernard',`<div class="card-sub">${state.tasks.filter(Boolean).length} étapes terminées sur 5</div><div class="statsbar"><div style="width:${state.tasks.filter(Boolean).length*20}%"></div></div>${['Préparer le matériel','Envoyer le livret d’accueil (simulation)','Créer les accès internes (simulation)','Programmer le rendez-vous d’accueil','Prévoir le point de fin de semaine'].map((x,i)=>`<div class="checkrow"><label><input type="checkbox" ${state.tasks[i]?'checked':''} onchange="toggleTask(${i})"> ${x}</label>${state.tasks[i]?status('Terminée'):status('En attente')}</div>`).join('')}`)}</div><div>${card('Bienvenue dans l’équipe',`<div class="illustration"><div class="eyebrow">Parcours d’accueil</div><h2>Un bon départ, à chaque arrivée.</h2><p>Suivez les étapes localement. Aucun message ni accès n’est réellement créé.</p></div>`)}</div></div>`,
docs:head('Documents RH','Vos modèles et ressources accessibles en quelques clics.',btn('+ Créer un document','openDocument()','primary'))+card('Bibliothèque de documents',`<div class="docgrid">${state.docs.map((d,i)=>`<div class="doc" onclick="showDoc(${i})"><div class="symbol">▤</div><strong>${safe(d)}</strong><small>Document de démonstration · Aperçu →</small></div>`).join('')}</div>`),
ai:head('Assistant IA RH','Un assistant fictif pour préparer vos réponses RH.')+`<div class="grid two"><div>${card('Assistant Équipe ✧',`<div class="chat" id="chat">${[{who:'bot',msg:'Bonjour Camille ! Je peux vous aider à préparer une réponse, résumer les congés ou créer une checklist d’intégration. Les réponses sont des exemples locaux, pas un avis juridique.'},...state.assistant].map(c=>`<div class="bubble ${c.who==='user'?'user':''}">${safe(c.msg)}</div>`).join('')}</div><div class="searchline"><input id="qchat" class="field" placeholder="Votre question RH…" onkeydown="if(event.key==='Enter')askAI()"><button class="button primary" onclick="askAI()">Envoyer (simulation)</button></div><div class="hint">Assistant à réponses prédéfinies : aucune IA externe n’est appelée. Vérifiez les règles et données réelles avant utilisation.</div>`)}</div><div>${card('Exemples de questions',`<div style="display:grid;gap:10px">${['Résume les congés en attente','Prépare une réponse à une demande de congé','Propose une checklist onboarding'].map(x=>`<button class="button" onclick="suggest('${x}')">${x} →</button>`).join('')}</div>`)}</div></div>`,
stats:head('Statistiques RH','Les indicateurs essentiels de votre organisation.')+`<div class="grid metrics">${[['Effectif',state.employees.length],['Congés validés',approved],['Demandes en attente',pending],['Candidatures',state.candidates.length]].map(([a,b])=>`<div class="card"><div class="metric-label">${a}</div><div class="metric-value">${b}</div><div class="delta">Données exemple</div></div>`).join('')}</div><div class="grid two"><div>${card('Répartition des équipes',`<div class="bars">${['Marketing','Commercial','Administration','Produit','Direction'].map(x=>{let n=state.employees.filter(p=>p[2]===x).length;return `<div><b style="height:${30+n*42}px"></b>${x}</div>`}).join('')}</div>`)}</div><div>${card('Suivi de l’intégration',`<div class="metric-value">${state.tasks.filter(Boolean).length}/5</div><div class="statsbar"><div style="width:${state.tasks.filter(Boolean).length*20}%"></div></div><p class="placeholder">Étapes complétées dans la checklist d’accueil.</p>${btn('Accéder à l’onboarding',"go('onboard')")}`)}</div></div>`};document.getElementById('pages').innerHTML=Object.entries(pages).map(([id,html])=>`<section class="page ${id===current?'active':''}" id="page-${id}">${html}</section>`).join('');if(current==='ai'){const c=document.getElementById('chat');c.scrollTop=c.scrollHeight}}
function employeeSearch(el){const pos=el.selectionStart;search=el.value;render();const next=document.querySelector('#page-employees input.field');if(next){next.focus();next.setSelectionRange(pos,pos)}}function go(id){current=id;filter='Toutes';search='';render();window.scrollTo({top:0,behavior:'smooth'})}function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}function openModal(html){document.getElementById('dialog').innerHTML=html;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function days(a,b){let start=new Date(a+'T12:00:00'),end=new Date(b+'T12:00:00');if(end<start)return 0;let n=0;while(start<=end){if(start.getDay()!==0&&start.getDay()!==6)n++;start.setDate(start.getDate()+1)}return n}
function openLeave(){openModal(`<h2>Nouvelle demande de congé</h2><p class="muted">Exemple : Emma Lefèvre, du 26 au 27 novembre 2026.</p><form onsubmit="submitLeave(event)"><label for="emp">Collaborateur</label><select class="field" id="emp">${state.employees.map(x=>`<option ${x[1]==='Emma Lefèvre'?'selected':''}>${safe(x[1])}</option>`).join('')}</select><label for="start">Date de début</label><input id="start" class="field" type="date" value="2026-11-26" required><label for="end">Date de fin</label><input id="end" class="field" type="date" value="2026-11-27" required><label for="note">Motif (facultatif)</label><textarea class="field" id="note" rows="2" placeholder="Commentaire à l'attention du responsable"></textarea><div class="actions"><button type="button" class="button" onclick="closeModal()">Annuler</button><button type="submit" class="button primary">Déposer la demande</button></div></form>`)}
function submitLeave(e){e.preventDefault();let s=document.getElementById('start').value,t=document.getElementById('end').value,n=days(s,t);if(n<1){toast('Choisissez une période valide contenant un jour ouvré.');return}state.requests.push({id:Date.now(),name:document.getElementById('emp').value,start:s,end:t,days:n,status:'En attente',type:'Congés payés'});save();closeModal();go('leave');toast('Demande déposée : validation en attente.');}
function decide(id,result){let r=state.requests.find(x=>x.id===id);if(!r)return;r.status=result;save();render();toast(result==='Validée'?'Congé validé : planning mis à jour.':'Demande refusée : planning inchangé.')}
function openAbsence(){openModal(`<h2>Signaler une absence</h2><p class="muted">Enregistrement local d’une absence fictive.</p><form onsubmit="submitAbsence(event)"><label>Collaborateur</label><select id="absenceEmp" class="field">${state.employees.map(x=>`<option>${safe(x[1])}</option>`).join('')}</select><label>Début</label><input id="absenceStart" class="field" type="date" value="2026-11-17" required><label>Fin</label><input id="absenceEnd" class="field" type="date" value="2026-11-17" required><div class="actions"><button type="button" class="button" onclick="closeModal()">Annuler</button><button class="button primary">Enregistrer</button></div></form>`)}function submitAbsence(e){e.preventDefault();let s=document.getElementById('absenceStart').value,t=document.getElementById('absenceEnd').value,n=days(s,t);if(n<1){toast('Dates invalides.');return}state.requests.push({id:Date.now(),name:document.getElementById('absenceEmp').value,start:s,end:t,days:n,status:'Validée',type:'Absence'});save();closeModal();go('absences');toast('Absence ajoutée localement.')}
function openEmployee(){openModal(`<h2>Ajouter un collaborateur</h2><form onsubmit="addEmployee(event)"><label>Nom complet</label><input id="ename" class="field" required maxlength="60" placeholder="Prénom Nom"><label>Équipe</label><select id="eteam" class="field">${['Marketing','Commercial','Administration','Produit','Direction'].map(x=>`<option>${x}</option>`).join('')}</select><label>Poste</label><input id="erole" class="field" required maxlength="80" placeholder="Intitulé du poste"><div class="actions"><button type="button" class="button" onclick="closeModal()">Annuler</button><button class="button primary">Ajouter</button></div></form>`)}function addEmployee(e){e.preventDefault();let n=document.getElementById('ename').value.trim();state.employees.push([n.split(' ').map(s=>s[0]).join('').slice(0,2),n,document.getElementById('eteam').value,document.getElementById('erole').value.trim()]);save();closeModal();go('employees');toast('Collaborateur ajouté à la démonstration.')}
function detail(initials){let p=state.employees.find(x=>x[0]===initials);if(!p)return;openModal(`<h2>Fiche collaborateur</h2><div style="margin:20px 0">${person(p[1],p[3])}</div><p>Équipe : <strong>${safe(p[2])}</strong></p><p class="muted">Fiche fictive. Aucune donnée personnelle réelle.</p><div class="actions">${btn('Fermer','closeModal()')}</div>`)}
function openRole(){openModal(`<h2>Créer une offre fictive</h2><form onsubmit="addRole(event)"><label>Intitulé du poste</label><input id="rname" class="field" required maxlength="80" placeholder="Ex. Responsable administratif"><div class="actions">${btn('Annuler','closeModal()')}<button class="button primary">Créer</button></div></form>`)}function addRole(e){e.preventDefault();state.roles.push(document.getElementById('rname').value.trim());save();closeModal();go('recruit');toast('Offre ajoutée localement.')}
function openCandidate(){openModal(`<h2>Ajouter une candidature</h2><form onsubmit="addCandidate(event)"><label>Nom</label><input id="cname" class="field" required maxlength="60"><label>Poste</label><select id="crole" class="field">${state.roles.map(x=>`<option>${safe(x)}</option>`).join('')}</select><div class="actions">${btn('Annuler','closeModal()')}<button class="button primary">Ajouter</button></div></form>`)}function addCandidate(e){e.preventDefault();state.candidates.push({name:document.getElementById('cname').value.trim(),role:document.getElementById('crole').value,stage:'À étudier'});save();closeModal();go('candidates');toast('Candidature fictive ajoutée.')}function moveCandidate(n){let c=state.candidates.find(x=>x.name===n);if(c)c.stage=c.stage==='À étudier'?'Entretien':'Finaliste';save();render();toast('Candidature passée à l’étape suivante.')}
function toggleTask(i){state.tasks[i]=!state.tasks[i];save();render()}function resetTasks(){state.tasks=[false,false,true,false,false];save();render();toast('Checklist réinitialisée.')}function openDocument(){openModal(`<h2>Créer un document fictif</h2><form onsubmit="addDoc(event)"><label>Nom du document</label><input id="dname" class="field" required maxlength="90"><div class="actions">${btn('Annuler','closeModal()')}<button class="button primary">Ajouter à la bibliothèque</button></div></form>`)}function addDoc(e){e.preventDefault();state.docs.push(document.getElementById('dname').value.trim());save();closeModal();go('docs');toast('Document fictif ajouté.')}function showDoc(i){openModal(`<h2>${safe(state.docs[i])}</h2><div class="hint">Aperçu de document — simulation. Ce modèle n’est pas un document juridique prêt à signer.</div><p style="line-height:2">Entreprise exemple<br>Document RH interne<br>Référence : EX-RH-${i+1}<br>Contenu d’exemple à adapter et à vérifier.</p><div class="actions">${btn('Fermer','closeModal()')} ${btn('Exporter un exemple',`exportDoc(${i})`,'primary')}</div>`)}function exportDoc(i){let content=`DOCUMENT FICTIF - DEMONSTRATION\n${state.docs[i]}\nEntreprise exemple\nContenu d'exemple, à vérifier et à adapter.`;download(`document-rh-${i+1}.txt`,content,'text/plain');toast('Exemple téléchargé localement.')}function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function suggest(q){document.getElementById('qchat').value=q;askAI()}function askAI(){let e=document.getElementById('qchat'),q=e.value.trim();if(!q)return;let answer=/cong[eé]s|absence/i.test(q)?`${state.requests.filter(r=>r.status==='En attente').length} demande(s) en attente. Pour une réponse au collaborateur : « Votre demande a bien été reçue. Elle sera examinée par votre responsable avant confirmation. »`:/onboard|int[eé]gration|arriv[eé]e/i.test(q)?'Checklist proposée : préparer le matériel, transmettre le livret, créer les accès, organiser l’accueil, prévoir un point de suivi.': 'Je peux préparer un brouillon de réponse RH ou récapituler vos demandes de congés fictives. Faites vérifier les décisions par un responsable.';state.assistant.push({who:'user',msg:q},{who:'bot',msg:answer});save();render()}
function resetAll(){state=base();save();endDemo();closeModal();go('home');toast('Démonstration réinitialisée.')}
const demos=[['La demande','Une collaboratrice dépose une demande pour deux jours de congé.','home'],['La réception','La demande apparaît dans la liste des congés en attente.','leave'],['La validation','Le responsable valide la demande.','leave'],['Le planning','Les deux dates passent en plein dans le planning partagé.','leave']];function updateDemo(){let [label,desc]=demos[demoStep];document.getElementById('demobar').classList.add('show');document.getElementById('demoCount').textContent=`ÉTAPE ${demoStep+1} / ${demos.length} · ${label}`;document.getElementById('demoText').textContent=desc;document.getElementById('demoNext').textContent=demoStep===3?'Terminer ✓':'Suivant →'}function startDemo(){state=base();save();demoStep=0;go('home');updateDemo();toast('Mode démo : scénario réinitialisé.')}function nextDemo(){if(demoStep===0){state.requests.push({id:9999,name:'Emma Lefèvre',start:'2026-11-26',end:'2026-11-27',days:2,status:'En attente',type:'Congés payés'});save();demoStep=1;go('leave')}else if(demoStep===1){demoStep=2;go('leave')}else if(demoStep===2){decide(9999,'Validée');demoStep=3;go('leave')}else{endDemo();toast('Parcours terminé. Vous pouvez continuer librement.');return}updateDemo()}function endDemo(){demoStep=-1;document.getElementById('demobar').classList.remove('show')}
/* Porte de pilotage (T-EXT-11) : étapes du parcours de capture existant, état déterministe à chaque appel. */
const ETAPES=['accueil','demande','reception','validation','planning','collaborateurs','onboarding','documents','assistant'];
function etatDemo(statut){state=base();if(statut)state.requests.push({id:9999,name:'Emma Lefèvre',start:'2026-11-26',end:'2026-11-27',days:2,status:statut,type:'Congés payés'});save()}
function allerEtape(id){if(!ETAPES.includes(id))throw new Error('étape inconnue : '+id);closeModal();filter='Toutes';search='';
if(id==='accueil'){etatDemo();demoStep=0;go('home');updateDemo()}
else if(id==='demande'||id==='reception'){etatDemo('En attente');demoStep=id==='demande'?1:2;go('leave');updateDemo()}
else if(id==='validation'||id==='planning'){etatDemo('Validée');demoStep=3;go('leave');updateDemo();if(id==='planning'){const c=document.querySelector('#page-leave .calendar');if(c&&c.scrollIntoView)c.scrollIntoView({block:'center'})}}
else{etatDemo('Validée');endDemo();const page={collaborateurs:'employees',onboarding:'onboard',documents:'docs',assistant:'ai'}[id];go(page);if(id==='assistant')suggest('Résume les congés en attente')}}
window.demoMaquette={etapes:ETAPES.slice(),aller:allerEtape,reinitialiser:resetAll};
render();</script></body></html>
