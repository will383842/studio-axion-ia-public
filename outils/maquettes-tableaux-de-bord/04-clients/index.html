ding:13px 18px;border-radius:11px;max-width:400px}.overlay-demo{position:fixed;inset:0;background:var(--voile);z-index:30;display:flex;justify-content:center;align-items:end;padding:30px}.demo-panel{width:min(800px,96vw);background:var(--white);border-radius:18px;padding:25px}.demo-meter{height:7px;background:var(--gris);border-radius:9px;margin:14px 0}.demo-meter div{height:100%;background:var(--accent);border-radius:9px}.demo-title{font-weight:850;font-size:22px;margin:0 0 5px}.demo-panel p{color:var(--mute)}.demo-controls{display:flex;gap:9px;justify-content:flex-end}.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer}.toggle input{accent-color:var(--terracotta)}.empty{text-align:center;padding:40px;color:var(--mute)}.caption{font-size:11px;color:var(--mute)}.hide{display:none!important}@media(max-width:1150px){.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.side{width:220px}.content{padding:23px}.topbar{padding:14px 23px}}@media(max-width:740px){.layout{display:block}.side{position:static;width:100%;height:auto;padding:12px;display:flex;align-items:center;overflow:auto}.brand{padding:3px 15px 3px 0;white-space:nowrap}.side-label,.side-foot{display:none}.nav{width:auto;white-space:nowrap;font-size:12px;padding:8px}.nav .glyph{display:none}.content{padding:17px}.topbar{padding:11px 16px}.topbar .small{display:none}.grid,.two,.form-grid{grid-template-columns:1fr}.page-head{align-items:start}.page-head h1{font-size:22px}.hero-art{display:none}.kanban{grid-template-columns:repeat(4,230px)}.input{width:100%}}

const KEY='espace_demo_clients_v1';let state;try{state=JSON.parse(sessionStorage.getItem(KEY))||seed()}catch{state=seed()}let current='dashboard',filter='',search='',sort='all',toastTimer;
function save(){try{sessionStorage.setItem(KEY,JSON.stringify(state))}catch{}}function h(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function ex(n){return n+' (exemple)'}function uid(a){return Math.max(0,...a.map(x=>x.id))+1}function toast(s){let e=document.getElementById('toast-root');e.innerHTML='<div class="toast">'+h(s)+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.innerHTML='',3500)}function log(s){state.activity.unshift({text:s,time:'À l’instant',type:'◈'});state.activity=state.activity.slice(0,9);save()}
function nav(id){current=id;filter='';search='';sort='all';render();window.scrollTo({top:0})}function head(title,subtitle,action=''){return `<div class="page-head"><div><h1>${title}</h1><p>${subtitle}</p></div><div>${action}</div></div>`}function badge(t){let v=/Gagné|Qualifié|Active|terminée|Client|Vérifié|Oui/.test(t)?'green':/pause|Proposition|À qualifier|Brouillon|partiel/.test(t)?'orange':/Erreur|Non|Perdu/.test(t)?'red':'';return `<span class="pill ${v}">${h(t)}</span>`}function table(headers,rows){return `<div class="table-wrap"><table class="table"><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}" class="empty">Aucun résultat pour ces critères.</td></tr>`}</tbody></table></div>`}function matches(x){return Object.values(x).join(' ').toLowerCase().includes(search.toLowerCase())&&(!sort||sort==='all'||Object.values(x).includes(sort))}function toolbar(placeholder,options='',extra=''){return `<div class="toolbar"><input class="input" id="search" placeholder="${placeholder}" value="${h(search)}" oninput="setSearch(this.value)"><select class="select" onchange="setSort(this.value)">${options||'<option value="all">Tous les statuts</option>'}</select>${extra}</div>`}function setSearch(v){search=v;render(true)}function setSort(v){sort=v;render(true)}function options(arr){return '<option value="all">Tous les statuts</option>'+arr.map(x=>`<option value="${h(x)}" ${sort===x?'selected':''}>${h(x)}</option>`).join('')}
function dashboard(){return head('Vue d’ensemble','Toutes vos opportunités commerciales au même endroit.',`<button class="btn primary" onclick="startDemo()">▶ Lancer le scénario</button>`)+`<div class="hero"><div><h2>Votre activité commerciale. Enfin sous contrôle.</h2><p>Suivez chaque contact, déclenchez des relances conditionnelles fictives et visualisez les prochaines actions — sans rien envoyer réellement.</p><button class="btn" onclick="nav('prospects')">Explorer les prospects →</button></div><div class="hero-art">◈</div></div><div class="grid">${[['Prospects',state.prospects.length,'Dossiers dans votre vivier (exemple)'],['Opportunités',state.deals.length,'Réparties dans le pipeline (exemple)'],['Clients',state.contacts.filter(c=>c.tag==='Client').length,'Fiches clients (exemple)'],['Campagnes',state.campaigns.length,'En mode simulation']].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="foot">${x[2]}</div></div>`).join('')}</div><div class="split"><div class="card"><h3>Pipeline commercial</h3>${['Qualification','Proposition','Négociation','Gagné'].map(st=>{let ds=state.deals.filter(x=>x.stage===st);return `<div class="barrow"><span style="width:95px;font-size:12px">${st}</span><div class="track"><div class="fill" style="width:${Math.min(100,ds.length*24+5)}%"></div></div><strong>${ds.length}</strong></div>`}).join('')}<button class="btn ghost" onclick="nav('pipeline')">Ouvrir le pipeline</button></div><div class="card"><h3>Activité récente</h3><div class="dots">${state.activity.slice(0,5).map(a=>`<div class="activity"><span class="bubble">${a.type}</span><div><strong>${h(a.text)}</strong><span>${h(a.time)}</span></div></div>`).join('')}</div></div></div>`}

function pipeline(){let stages=['Qualification','Proposition','Négociation','Gagné'];return head('Pipeline','Déplacez les opportunités d’une étape à l’autre.',`<button class="btn primary" onclick="editForm('deal')">+ Nouvelle opportunité</button>`)+`<div class="kanban">${stages.map(st=>`<section class="lane"><div class="lane-top"><span>${st}</span>${badge(String(state.deals.filter(d=>d.stage===st).length))}</div>${state.deals.filter(d=>d.stage===st).map(d=>`<article class="deal"><small>${h(d.company)}</small><strong>${h(d.title)}</strong><small>${h(d.contact)}</small><div class="actions"><select aria-label="Changer l’étape" class="select" onchange="moveDeal(${d.id},this.value)">${stages.map(s=>`<option ${s===d.stage?'selected':''}>${s}</option>`).join('')}</select><button class="btn smallbtn" onclick="detail('deal',${d.id})">Voir</button></div></article>`).join('')||'<p class="small">Aucune opportunité</p>'}</section>`).join('')}</div>`}
function clients(){let arr=state.contacts.filter(c=>c.tag==='Client');return head('Fiches clients','Une fiche centralisée et l’historique de chaque relation.')+`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${arr.map(x=>`<div class="card"><div style="display:flex;align-items:center;gap:12px"><div class="avatar">${h(x.name.split(' ').map(z=>z[0]).join(''))}</div><div><strong>${h(x.company)}</strong><div class="small">${h(x.name)}</div></div></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="small">${h(x.role)} • ${h(x.email)}</div><p>${h(x.note)}</p><button class="btn ghost" onclick="detail('contact',${x.id})">Ouvrir la fiche →</button></div>`).join('')}</div>`}
function campaigns(){return head('Campagnes email','Concevez et prévisualisez des campagnes sans envoyer d’e-mail.',`<button class="btn primary" onclick="editForm('campaign')">+ Créer une campagne</button>`)+`<div class="note">Mode démonstration : les envois, réponses et statistiques sont fictifs. Aucune messagerie n’est connectée.</div>`+toolbar('Chercher une campagne...',options(['Brouillon','Simulation terminée']))+table(['Campagne','Audience','Objet','Statut','Contacts simulés','Réponses fictives','Actions'],state.campaigns.filter(matches).map(c=>[h(c.name),h(c.audience),h(c.subject),badge(c.status),ex(c.sent),ex(c.reply),`<button class="btn smallbtn" onclick="detail('campaign',${c.id})">Aperçu</button> <button class="btn smallbtn primary" onclick="simulateCampaign(${c.id})">Simuler</button>`]))}
function sequences(){return head('Relances conditionnelles','Des scénarios visibles avec arrêt dès qu’une réponse est simulée.',`<button class="btn primary" onclick="editForm('sequence')">+ Nouvelle séquence</button>`)+`<div class="note">Règle de sécurité simulée : arrêt sur réponse, désinscription ou changement de statut. Aucune relance réelle.</div><div class="two">${state.sequences.map(s=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><h3>${h(s.name)}</h3>${badge(s.enabled?'Active (simulation)':'En pause')}</div><div class="small">Déclencheur : ${h(s.trigger)}</div><div class="small">Condition : ${h(s.condition)}</div><div style="margin:18px 0">${s.steps.map((st,i)=>`<div class="step"><span class="number">${i+1}</span>${h(st)}</div>`).join('')}</div><button class="btn ghost" onclick="toggleSequence(${s.id})">${s.enabled?'Mettre en pause':'Activer la simulation'}</button> <button class="btn" onclick="detail('sequence',${s.id})">Détails</button></div>`).join('')}</div>`}
function mailboxes(){return head('Boîtes d’envoi','Suivi illustratif des comptes et limites d’expédition.',`<button class="btn primary" onclick="editForm('mailbox')">+ Ajouter une boîte fictive</button>`)+`<div class="note warnnote">Toutes les boîtes utilisent des adresses d’exemple et ne sont reliées à aucun serveur d’envoi.</div>`+table(['Adresse fictive','Responsable','Indice simulé','Limite illustrative','Statut','Action'],state.mailboxes.map(m=>[h(m.address),h(m.owner),`<strong>${m.health}/100</strong> <span class="small">exemple</span>`,`${m.daily}/jour (exemple)`,badge(m.status),`<button class="btn smallbtn" onclick="toggleMailbox(${m.id})">${m.status.includes('pause')?'Réactiver':'Mettre en pause'}</button>`]))}
function domains(){return head('Domaines d’envoi','Visualisez les vérifications DNS théoriques et leur état fictif.',`<button class="btn primary" onclick="editForm('domain')">+ Ajouter un domaine fictif</button>`)+`<div class="note">SPF, DKIM et DMARC : statuts inventés pour l’interface. Aucune vérification DNS n’est réalisée.</div><div class="two">${state.domains.map(d=>`<div class="card domain"><div style="display:flex;justify-content:space-between"><h3>${h(d.name)}</h3>${badge(d.health>=80?'Vérifié (fictif)':'Partiel (fictif)')}</div><p class="small">Indice de configuration simulé : ${d.health}/100 (exemple)</p><div class="meter"><div style="width:${d.health}%"></div></div><div style="display:flex;gap:8px;flex-wrap:wrap">${['spf','dkim','dmarc'].map(k=>`<span class="pill ${d[k]?'green':'red'}">${k.toUpperCase()} : ${d[k]?'Oui':'Non'}</span>`).join('')}</div><div style="margin-top:18px"><button class="btn ghost" onclick="inspectDomain(${d.id})">Examiner la configuration</button></div></div>`).join('')}</div>`}
function deliverability(){let avg=Math.round(state.domains.reduce((a,b)=>a+b.health,0)/Math.max(1,state.domains.length));return head('Délivrabilité','Indicateurs fictifs de réputation et points de vigilance.')+`<div class="note warnnote">Aucun test SMTP, contrôle de blacklist ou placement en boîte de réception n’est exécuté. Ces valeurs servent uniquement à la démonstration.</div><div class="grid">${[['Indice domaine',avg+'/100 (exemple)'],['Boîtes suivies',state.mailboxes.length],['Domaines suivis',state.domains.length],['Alertes fictives',state.domains.filter(d=>!d.dkim||!d.spf||!d.dmarc).length]].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}</div><div class="split"><div class="card"><h3>Contrôles de démonstration</h3>${state.domains.map(d=>`<div class="barrow"><span style="width:200px;font-size:12px">${h(d.name)}</span><div class="track"><div class="fill" style="width:${d.health}%"></div></div>${d.health}</div>`).join('')}<button class="btn ghost" onclick="runHealthCheck()">↻ Recalculer les indices fictifs</button></div><div class="card"><h3>Points à contrôler en production</h3><div class="dots">${['Authentification SPF, DKIM et DMARC','Consentement et base légale des contacts','Gestion des réponses et désinscriptions','Surveillance de la réputation et des erreurs'].map(x=>`<div class="activity"><span class="bubble">✓</span><strong>${x}</strong></div>`).join('')}</div></div></div>`}
function reports(){let stages=['Qualification','Proposition','Négociation','Gagné'];return head('Rapports','Consultez les résultats d’un jeu de données fictif.',`<button class="btn ghost" onclick="exportCSV()">↓ Exporter un rapport CSV</button>`)+`<div class="grid">${[['Prospects suivis',state.prospects.length],['Opportunités gagnées',state.deals.filter(d=>d.stage==='Gagné').length],['Fiches clients',state.contacts.filter(c=>c.tag==='Client').length],['Réponses simulées',ex(state.campaigns.reduce((a,b)=>a+b.reply,0))]].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}</div><div class="split"><div class="card"><h3>Répartition des opportunités</h3><div class="chart">${stages.map((st,i)=>`<div style="height:${20+state.deals.filter(d=>d.stage===st).length*43}%" title="${st}"><span>${st}</span></div>`).join('')}</div><p class="caption" style="margin-top:37px">Volumes inventés (exemple) — mise à jour selon vos interactions locales.</p></div><div class="card"><h3>Campagnes de démonstration</h3>${state.campaigns.map(c=>`<div class="barrow"><span style="min-width:140px;font-size:12px">${h(c.name)}</span><div class="track"><div class="fill" style="width:${Math.min(100,c.sent*1.5)}%"></div></div><strong>${ex(c.sent)}</strong></div>`).join('')}</div></div>`}
function settings(){let s=state.settings;return head('Paramètres','Préférences locales, sans synchronisation externe.',`<button class="btn ghost" onclick="resetData()">Restaurer la démonstration</button>`)+`<div class="two"><div class="card"><h3>Espace de travail</h3><label class="field">Nom de l’espace<input class="input" id="workspace" value="${h(s.workspace)}"></label><br><button class="btn primary" onclick="updateWorkspace()">Enregistrer localement</button></div><div class="card"><h3>Règles de démonstration</h3>${[['notifications','Notifications locales'],['autoPause','Arrêt simulé sur réponse'],['approval','Validation humaine avant action']].map(([k,t])=>`<div style="margin:14px 0"><label class="toggle"><input type="checkbox" ${s[k]?'checked':''} onchange="updateSetting('${k}',this.checked)">${t}</label></div>`).join('')}<div class="note">Ces réglages modifient la présentation locale uniquement.</div></div></div><div class="card" style="margin-top:18px"><h3>Confidentialité de cette démonstration</h3><p>Les données sont fictives. Elles restent dans la session du navigateur. Aucun serveur, service d’emailing, système de suivi ou API n’est appelé.</p><button class="btn warn" onclick="resetData()">Effacer la session et restaurer les exemples</button></div>`}
const views={dashboard,prospects,contacts,pipeline,clients,campaigns,sequences,mailboxes,domains,deliverability,reports,settings};function render(preserve=false){let focus=preserve?document.activeElement?.id:null, pos=preserve&&focus?document.getElementById(focus)?.selectionStart:null;document.getElementById('nav').innerHTML=pages.map(([id,ico,name],i)=>`${i===5?'<div class="side-label">Engagement & analyse</div>':''}<button class="nav ${id===current?'active':''}" onclick="nav('${id}')"><span class="glyph">${ico}</span>${name}</button>`).join('');document.getElementById('content').innerHTML=views[current]();if(focus){let e=document.getElementById(focus);if(e){e.focus();if(e.setSelectionRange&&typeof pos==='number')e.setSelectionRange(pos,pos)}}}function modal(content){document.getElementById('modal-root').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${content}</div></div>`}function closeModal(){document.getElementById('modal-root').innerHTML=''}function modalHead(t){return `<div class="modal-head"><h2>${t}</h2><button class="btn smallbtn" onclick="closeModal()">✕</button></div>`}function field(label,key,val='',type='text',required=true){return `<label class="field">${label}<input class="input" name="${key}" type="${type}" value="${h(val)}" ${required?'required':''}></label>`}
function editForm(type,id){let map={prospect:'prospects',contact:'contacts',deal:'deals',campaign:'campaigns',sequence:'sequences',mailbox:'mailboxes',domain:'domains'};let coll=map[type],obj=id?state[coll].find(x=>x.id===id):{};let fields={prospect:field('Nom','name',obj.name)+field('Entreprise','company',obj.company)+field('Email fictif','email',obj.email,'email')+field('Secteur','sector',obj.sector)+field('Besoin','interest',obj.interest),contact:field('Nom','name',obj.name)+field('Entreprise','company',obj.company)+field('Email fictif','email',obj.email,'email')+field('Téléphone','phone',obj.phone)+field('Fonction','role',obj.role),deal:field('Intitulé','title',obj.title)+field('Entreprise','company',obj.company)+field('Contact','contact',obj.contact),campaign:field('Nom','name',obj.name)+field('Audience','audience',obj.audience)+field('Objet','subject',obj.subject),sequence:field('Nom','name',obj.name)+field('Déclencheur','trigger',obj.trigger)+field('Condition','condition',obj.condition),mailbox:field('Adresse fictive','address',obj.address||'prenom@exemple.invalid','email')+field('Responsable','owner',obj.owner),domain:field('Domaine fictif','name',obj.name||'domaine.example')};modal(modalHead((id?'Modifier':'Créer')+' — '+type)+`<form onsubmit="submitForm(event,'${type}',${id||0})"><div class="form-grid">${fields[type]}</div><div class="note">Données de test enregistrées localement. Aucune connexion externe.</div><div style="display:flex;justify-content:flex-end;gap:10px"><button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>`)}
function submitForm(e,type,id){e.preventDefault();let obj=Object.fromEntries(new FormData(e.target).entries()),coll={prospect:'prospects',contact:'contacts',deal:'deals',campaign:'campaigns',sequence:'sequences',mailbox:'mailboxes',domain:'domains'}[type],prev=state[coll].find(x=>x.id===id);if(type==='prospect')Object.assign(obj,{score:65,status:'Nouveau',owner:'Léa Martin',source:'Saisie manuelle',consent:'À vérifier'});if(type==='contact')Object.assign(obj,{tag:'Prospect',note:'Contact créé dans la démonstration'});if(type==='deal')obj.stage='Qualification';if(type==='campaign')Object.assign(obj,{status:'Brouillon',sent:0,reply:0});if(type==='sequence')Object.assign(obj,{enabled:false,steps:['Premier contact fictif','Relance sous condition','Arrêt en cas de réponse']});if(type==='mailbox')Object.assign(obj,{health:80,status:'En pause (simulation)',daily:0});if(type==='domain')Object.assign(obj,{spf:false,dkim:false,dmarc:false,health:30});if(prev)Object.assign(prev,obj);else state[coll].unshift({...obj,id:uid(state[coll])});log(type+' : '+(id?'mise à jour':'création')+' locale');save();closeModal();render();toast('Enregistré dans cette session de démonstration')}
function detail(type,id){let map={prospect:'prospects',contact:'contacts',deal:'deals',campaign:'campaigns',sequence:'sequences'},a=state[map[type]].find(x=>x.id===id);if(!a)return;let details=Object.entries(a).filter(([k])=>!['id','steps'].includes(k)).map(([k,v])=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0;gap:12px"><span class="small">${h(k)}</span><strong style="text-align:right">${h(v)}</strong></div>`).join('');let act=type==='prospect'?`<button class="btn primary" onclick="closeModal();qualify(${id})">Qualifier</button> <button class="btn" onclick="closeModal();convert(${id})">Convertir</button>`:type==='contact'?`<button class="btn primary" onclick="closeModal();editForm('contact',${id})">Modifier</button>`:type==='deal'?`<button class="btn primary" onclick="closeModal();editForm('deal',${id})">Modifier</button>`:type==='campaign'?`<button class="btn primary" onclick="closeModal();simulateCampaign(${id})">Simuler la campagne</button>`:'';modal(modalHead(h(a.name||a.title||a.address||'Détails'))+details+(a.steps?`<h3>Étapes</h3>${a.steps.map(x=>`<div class="step">${h(x)}</div>`).join('')}`:'')+`<div style="margin-top:18px">${act}</div>`)}
function qualify(id){let p=state.prospects.find(x=>x.id===id);if(!p)return;p.status='Qualifié';p.score=Math.max(85,p.score);log('Prospect '+p.name+' qualifié (simulation)');save();render();toast('Qualification simulée : '+p.name)}function convert(id){let p=state.prospects.find(x=>x.id===id);if(!p)return;if(p.status==='Converti'){toast('Ce prospect est déjà converti.');return}p.status='Converti';let n=uid(state.deals);state.deals.unshift({id:n,title:'Projet CRM — '+p.company,company:p.company,contact:p.name,stage:'Qualification'});if(!state.contacts.some(c=>c.email===p.email))state.contacts.unshift({id:uid(state.contacts),name:p.name,company:p.company,email:p.email,phone:'Non renseigné',role:'Décideur',tag:'Prospect',note:'Issu de la conversion locale'});log('Prospect '+p.name+' converti en opportunité');save();render();toast('Opportunité créée dans le pipeline (simulation)')}
function moveDeal(id,stage){let d=state.deals.find(x=>x.id===id);if(!d)return;d.stage=stage;log('« '+d.title+' » déplacée vers '+stage);if(stage==='Gagné'){let c=state.contacts.find(x=>x.name===d.contact);if(c)c.tag='Client'}save();render();toast('Étape modifiée localement')}
function simulateCampaign(id){let c=state.campaigns.find(x=>x.id===id);if(!c)return;modal(modalHead('Simulation de campagne')+`<div class="note">Aucun email ne sera envoyé. Les chiffres qui suivent seront inventés (exemple) pour illustrer un scénario.</div><strong>${h(c.name)}</strong><p>Objet : ${h(c.subject)}</p><p>Audience : ${h(c.audience)}</p><button class="btn primary" onclick="confirmCampaign(${id})">▶ Exécuter la simulation</button>`)}function confirmCampaign(id){let c=state.campaigns.find(x=>x.id===id);c.status='Simulation terminée';c.sent=24;c.reply=5;log('Campagne « '+c.name+' » simulée : aucun envoi');save();closeModal();render();toast('Simulation terminée, sans envoi réel')}
function toggleSequence(id){let x=state.sequences.find(s=>s.id===id);x.enabled=!x.enabled;log('Séquence « '+x.name+' » : '+(x.enabled?'activée':'mise en pause')+' (simulation)');save();render()}function toggleMailbox(id){let x=state.mailboxes.find(m=>m.id===id);x.status=x.status.includes('pause')?'Active (simulation)':'En pause (simulation)';save();render();toast('Statut local modifié')}
function inspectDomain(id){let d=state.domains.find(x=>x.id===id);modal(modalHead('Diagnostic fictif : '+h(d.name))+`<div class="note">Aucune interrogation DNS. Les trois états sont des valeurs fictives modifiables.</div>${['spf','dkim','dmarc'].map(k=>`<label class="toggle" style="display:flex;margin:14px 0"><input type="checkbox" ${d[k]?'checked':''} onchange="setDns(${id},'${k}',this.checked)">${k.toUpperCase()} — ${d[k]?'présent':'absent'} (simulation)</label>`).join('')}<button class="btn" onclick="closeModal();render()">Terminer</button>`)}function setDns(id,key,val){let d=state.domains.find(x=>x.id===id);d[key]=val;d.health=30+['spf','dkim','dmarc'].filter(k=>d[k]).length*21;save();inspectDomain(id)}function runHealthCheck(){log('Indices de réputation fictifs recalculés');save();render();toast('Contrôle simulé : aucun serveur interrogé')}
function removeItem(coll,id){let x=state[coll].find(x=>x.id===id);modal(modalHead('Confirmer la suppression')+`<p>Supprimer « ${h(x?.name||'cet élément')} » de cette session ?</p><button class="btn warn" onclick="state.${coll}=state.${coll}.filter(x=>x.id!==${id});save();closeModal();render();toast('Supprimé localement')">Supprimer</button> <button class="btn" onclick="closeModal()">Annuler</button>`)}function updateWorkspace(){state.settings.workspace=document.getElementById('workspace').value;save();toast('Nom enregistré localement')}function updateSetting(k,v){state.settings[k]=v;save();toast('Préférence enregistrée')}
function exportCSV(){let rows=[['Étape','Nombre (exemple)']];for(let s of ['Qualification','Proposition','Négociation','Gagné']){let d=state.deals.filter(x=>x.stage===s);rows.push([s,d.length])}let csv='﻿'+rows.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='rapport-exemple.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('Rapport CSV local exporté')}
function resetData(){modal(modalHead('Réinitialiser la démonstration ?')+`<p>Vous retrouverez les données fictives initiales. Toutes les modifications de cette session seront perdues.</p><button class="btn primary" onclick="state=seed();save();closeModal();nav('dashboard');toast('Démonstration réinitialisée')">Confirmer</button> <button class="btn" onclick="closeModal()">Annuler</button>`)}
const steps=[{page:'dashboard',title:'1. Une demande commerciale arrive',desc:'Un prospect entrant se manifeste depuis le site. Espace démo · Clients le centralise dans la liste, sans ressaisie.',action:'inbound'},{page:'prospects',title:'2. Le prospect est qualifié',desc:'Son besoin est identifié et un score illustratif aide à prioriser la prise de contact.',action:'qualify'},{page:'sequences',title:'3. La relance est conditionnelle',desc:'Une séquence de suivi est préparée. Sans réponse, la relance suivante serait planifiée ; une réponse l’interromprait.',action:'followup'},{page:'campaigns',title:'4. Une réponse est simulée',desc:'Le prospect répond dans ce scénario fictif. La séquence s’arrête et le commercial reprend la main.',action:'reply'},{page:'pipeline',title:'5. Une opportunité est créée',desc:'Le dossier commercial progresse dans le pipeline jusqu’à la conversion illustrative.',action:'convert'},{page:'clients',title:'6. Le prospect devient client',desc:'La fiche client est mise à jour. Le parcours complet reste visible dans les rapports.',action:'won'}];let demoIndex=-1,demoPlaying=false,demoTimer=null;function startDemo(){state=seed();save();demoIndex=0;demoPlaying=false;runDemoStep()}function mutateDemo(i){let p=state.prospects.find(x=>x.id===1);if(i===0){if(!state.events.includes('inbound')){log('Nouvelle demande reçue : Camille Bernard (fictive)');state.events.push('inbound')}}if(i===1){p.status='Qualifié';p.score=92;log('Camille Bernard qualifiée, score illustratif 92/100 (exemple)')}if(i===2){state.sequences[0].enabled=true;log('Relance conditionnelle préparée — aucun envoi')}if(i===3){state.events.push('reply');state.sequences[0].enabled=false;log('Réponse fictive reçue : séquence interrompue')}if(i===4){p.status='Converti';if(!state.deals.find(d=>d.company==='Atelier Nova'))state.deals.unshift({id:90,title:'Projet CRM — Atelier Nova',company:'Atelier Nova',contact:'Camille Bernard',stage:'Proposition'});if(!state.contacts.find(c=>c.name==='Camille Bernard'))state.contacts.unshift({id:90,name:'Camille Bernard',company:'Atelier Nova',email:p.email,phone:'Non renseigné',role:'Dirigeante',tag:'Prospect',note:'A répondu au scénario fictif'});log('Opportunité fictive créée — Atelier Nova')}if(i===5){let d=state.deals.find(d=>d.company==='Atelier Nova');d.stage='Gagné';state.contacts.find(c=>c.name==='Camille Bernard').tag='Client';log('Atelier Nova convertie en client (simulation)')}save()}
function runDemoStep(){clearTimeout(demoTimer);if(demoIndex<0||demoIndex>=steps.length){stopDemo();return}let x=steps[demoIndex];mutateDemo(demoIndex);current=x.page;search='';sort='all';render();document.getElementById('modal-root').innerHTML=`<div class="overlay-demo"><div class="demo-panel"><span class="pill">PARCOURS ANIMÉ · DONNÉES FICTIVES</span><div class="demo-meter"><div style="width:${((demoIndex+1)/steps.length)*100}%"></div></div><h2 class="demo-title">${x.title}</h2><p>${x.desc}</p><div class="demo-controls"><button class="btn" onclick="stopDemo()">Fermer</button><button class="btn ghost" onclick="restartDemo()">↻ Rejouer</button><button class="btn ghost" onclick="autoDemo()">▶ Lecture auto</button><button class="btn primary" onclick="nextDemo()">${demoIndex===steps.length-1?'Terminer':'Étape suivante →'}</button></div></div></div>`}
function autoDemo(){clearTimeout(demoTimer);demoTimer=setTimeout(function advance(){if(demoIndex<0)return;if(demoIndex>=steps.length-1){stopDemo();toast('Scénario terminé');return}demoIndex++;runDemoStep();demoTimer=setTimeout(advance,2300)},2300)}function nextDemo(){if(demoIndex===steps.length-1){stopDemo();return}demoIndex++;runDemoStep()}function stopDemo(){clearTimeout(demoTimer);demoIndex=-1;document.getElementById('modal-root').innerHTML='';render()}function restartDemo(){startDemo()}
/* Porte de pilotage : ids = étapes du parcours animé existant (steps), dans l'ordre. */
const IDS_ETAPES=['demande','qualification','relance','reponse','opportunite','client'];
window.demoMaquette={aller(id){let i=IDS_ETAPES.indexOf(id);if(i<0)throw new Error('etape inconnue : '+id);clearTimeout(demoTimer);state=seed();for(let k=0;k<i;k++)mutateDemo(k);save();demoIndex=i;runDemoStep()},reinitialiser(){clearTimeout(demoTimer);clearTimeout(toastTimer);state=seed();try{sessionStorage.removeItem(KEY)}catch{}demoIndex=-1;current='dashboard';filter='';search='';sort='all';document.getElementById('modal-root').innerHTML='';document.getElementById('toast-root').innerHTML='';render();window.scrollTo(0,0)}};
render();
