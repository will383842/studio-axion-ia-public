<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace démo · Accueil 24 h — démonstration</title><link rel="stylesheet" href="../charte/charte.css"><style>
:root{--noir-doux:#262624;--ligne:#E8E6DC;--fond-doux:#F3F1EA;--terracotta-pale:#F6E7DF;--orange-pale:#FBEDE6;--reussite-pale:#E9EEE5;--muted:var(--texte-secondaire);--ink:var(--noir)}
*{box-sizing:border-box}
body{margin:0;padding-top:32px;background:var(--ivoire);font-size:14px;line-height:1.5;font-family:"Manrope",sans-serif;color:var(--noir)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 32px)}
aside{background:var(--noir);color:var(--gris-sur-noir);padding:26px 16px;display:flex;flex-direction:column;gap:25px}
.brand{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:800;color:var(--blanc);letter-spacing:-.3px;padding:0 9px}
.brand-mark{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:11px;background:var(--terracotta);font-size:18px}
.org{margin:0 8px;padding:12px;border:1px solid var(--noir-doux);border-radius:12px;font-size:12px;color:var(--gris-sur-noir)}
.nav{display:grid;gap:5px}
.nav button{background:none;color:var(--gris-sur-noir);border:0;border-radius:10px;text-align:left;padding:11px 13px;font-weight:600;display:flex;gap:10px;align-items:center;width:100%}
.nav button.active,.nav button:hover{background:var(--noir-doux);color:var(--blanc)}
.nav .ico{width:22px;text-align:center}
.foot{margin-top:auto;font-size:12px;color:var(--gris-sur-noir);padding:12px}
.main{min-width:0}
.top{height:77px;background:var(--blanc);border-bottom:1px solid var(--ligne);display:flex;justify-content:space-between;align-items:center;padding:0 32px;gap:12px}
.top h1{font-size:21px;letter-spacing:-.5px;margin:0}
.top-right{display:flex;gap:10px;align-items:center}
.pill{border-radius:30px;padding:6px 11px;background:var(--reussite-pale);color:var(--reussite);font-weight:750;font-size:12px}
.btn{border:0;border-radius:10px;padding:10px 15px;background:var(--terracotta);color:var(--blanc);font-weight:700}
.btn.secondary{background:var(--gris);color:var(--noir)}
.btn.outline{border:1px solid var(--gris);background:var(--blanc);color:var(--noir)}
.btn.warn{background:var(--orange-pale);color:var(--terracotta)}
.btn:disabled{opacity:.6;cursor:default}
.page{padding:28px 32px;max-width:1460px;margin:auto}
.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:21px}
.heading h2{font-size:25px;letter-spacing:-.7px;margin:0 0 4px}
.muted{color:var(--texte-secondaire)}
.eyebrow{font-weight:750;letter-spacing:1.3px;text-transform:uppercase;font-size:10px;color:var(--terracotta)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.panel{background:var(--blanc);border:1px solid var(--ligne);border-radius:16px;padding:20px;min-width:0}
.metric .value{font-size:35px;letter-spacing:-1.1px;font-weight:800;margin:5px 0}
.metric .label{font-size:12px;color:var(--texte-secondaire);font-weight:600}
.metric .hint{font-size:12px;color:var(--terracotta)}
.contentgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:16px;margin-top:16px}
.section-title{font-size:16px;font-weight:800;margin:0 0 16px}
.stack{display:grid;gap:10px}
.ticket{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:13px;border:1px solid var(--ligne);border-radius:12px;cursor:pointer}
.ticket:hover{background:var(--fond-doux)}
.ticket strong{display:block}
.mini{font-size:12px;color:var(--texte-secondaire)}
.status{font-size:11px;font-weight:800;border-radius:7px;padding:4px 8px;background:var(--gris);color:var(--noir);display:inline-block}
.status.urgent{background:var(--orange-pale);color:var(--terracotta)}
.status.good{background:var(--reussite-pale);color:var(--reussite)}
.splitbar{height:13px;display:flex;overflow:hidden;border-radius:20px;background:var(--gris);margin:18px 0}
.splitbar .auto{width:80%;background:var(--terracotta)}
.splitbar .human{width:20%;background:var(--orange)}
.ratio{display:flex;justify-content:space-between;gap:12px}
.ratio strong{font-size:25px}
.timeline{position:relative;display:grid;gap:15px}
.event{display:flex;gap:12px;align-items:start}
.dot{background:var(--terracotta-pale);color:var(--terracotta);border-radius:9px;min-width:29px;height:29px;display:grid;place-items:center;font-weight:800}
.event strong{display:block}
.hidden{display:none!important}
.workflow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:15px 0 20px}
.step{background:var(--blanc);border:1px solid var(--ligne);border-radius:12px;padding:14px;font-size:12px;min-height:96px}
.step .num{font-size:11px;font-weight:800;color:var(--texte-secondaire)}
.step strong{display:block;font-size:13px;margin:5px 0}
.step.done{border-color:var(--reussite);background:var(--reussite-pale)}
.step.active{border:2px solid var(--terracotta);background:var(--terracotta-pale)}
.demo-grid{display:grid;grid-template-columns:minmax(320px,1fr) minmax(320px,1fr);gap:16px}
.chatwrap{border:1px solid var(--ligne);border-radius:15px;overflow:hidden}
.chatheader{background:var(--fond-doux);padding:12px 15px;font-weight:800;border-bottom:1px solid var(--ligne)}
.chatbody{height:270px;overflow:auto;padding:16px;background:var(--blanc);display:flex;flex-direction:column;gap:12px}
.bubble{border-radius:15px;padding:11px 14px;max-width:90%;background:var(--gris);align-self:flex-start}
.bubble.client{background:var(--terracotta);color:var(--blanc);align-self:flex-end}
.chatinput{border-top:1px solid var(--ligne);padding:10px;display:flex;gap:9px}
.chatinput input{border:0;flex:1;min-width:0;padding:7px}
.alertbox{border:1px solid var(--orange);background:var(--orange-pale);border-radius:13px;padding:15px}
.draft{background:var(--fond-doux);border:1px solid var(--ligne);border-radius:12px;padding:14px;margin:12px 0;white-space:pre-wrap;font-size:13px}
.channel{display:flex;align-items:center;gap:9px;font-weight:800}
.purple{color:var(--terracotta)}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}
.layout-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;color:var(--texte-secondaire);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.table th,.table td{padding:13px 9px;border-bottom:1px solid var(--ligne)}
input.search,select.filter{width:100%;padding:11px;border:1px solid var(--gris);border-radius:10px;background:var(--blanc)}
.help{border-left:3px solid var(--terracotta);padding:9px 12px;background:var(--fond-doux);font-size:12px;color:var(--texte-secondaire);margin-top:12px}
.toast{position:fixed;bottom:26px;right:25px;background:var(--noir);color:var(--blanc);padding:13px 18px;border-radius:11px;z-index:10}
.chart{display:flex;align-items:end;gap:12px;height:130px;padding-top:18px}
.bar{flex:1;border-radius:6px 6px 0 0;background:var(--terracotta);min-height:10px;position:relative}
.bar span{position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--texte-secondaire)}
.tag{display:inline-block;border:1px solid var(--ligne);padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}
.wide{grid-column:1/-1}
@media(max-width:1050px){.grid4{grid-template-columns:repeat(2,1fr)}.workflow{grid-template-columns:repeat(3,1fr)}.demo-grid,.contentgrid{grid-template-columns:1fr}}
@media(max-width:730px){.app{grid-template-columns:1fr}aside{padding:12px;gap:10px}.brand{font-size:14px}.org,.foot{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto;font-size:11px}.top{padding:0 15px;height:65px}.top h1{font-size:16px}.page{padding:17px}.workflow{grid-template-columns:1fr 1fr}.grid4{gap:10px}.metric .value{font-size:26px}.layout-2{grid-template-columns:1fr}}
</style></head><body><div class="mention-demo">Démonstration · données fictives</div><div class="app"><aside><div class="brand"><span class="brand-mark">✦</span> Espace démo · Accueil 24 h</div><div class="org">Espace entreprise<br><strong>Entreprise exemple</strong></div><nav class="nav" id="nav"></nav><div class="foot">● Service client intelligent<br>Hors des heures d’ouverture, avec relecture humaine</div></aside><main class="main"><header class="top"><h1 id="top-title">Vue d'ensemble</h1><div class="top-right"><span class="pill">● Accueil IA actif hors des heures d’ouverture</span><button class="btn secondary" onclick="resetDemo()">↺ Réinitialiser</button></div></header><div id="view" class="page"></div></main></div><div id="toast" class="toast hidden"></div><script>
const client='Entreprise exemple';const navs=[['dashboard','▦','Vue d’ensemble'],['scenario','✦','Parcours IA → humain'],['conversations','◉','Conversations'],['alerts','!','Alertes & transferts'],['knowledge','▤','Base de connaissances'],['analytics','▥','Analyses'],['settings','⚙','Paramètres']];const initialTickets=[{id:'R-1028',who:'Lucie Martin',title:'Livraison non reçue',channel:'Chat web',urgent:false,status:'Résolu par IA',type:'Livraison',date:'10 nov. · 08:42'},{id:'R-1029',who:'Marc Delaire',title:'Modification de facture',channel:'Chat web',urgent:false,status:'Résolu par IA',type:'Facturation',date:'10 nov. · 09:13'},{id:'R-1030',who:'Sarah Perrin',title:'Panne bloquante du service',channel:'Chat web',urgent:true,status:'À qualifier',type:'Incident',date:'10 nov. · 02:17'},{id:'R-1031',who:'Nina Bouvet',title:'Disponibilités de l’offre',channel:'Chat web',urgent:false,status:'Résolu par IA',type:'Commercial',date:'10 nov. · 09:24'},{id:'R-1032',who:'Tom Rivier',title:'Suivi de commande',channel:'Chat web',urgent:false,status:'Résolu par IA',type:'Commande',date:'10 nov. · 10:07'},{id:'R-1033',who:'Emma Varenne',title:'Erreur de contrat',channel:'Chat web',urgent:true,status:'En attente équipe',type:'Contrat',date:'10 nov. · 07:08'},{id:'R-1034',who:'Hugo Garnier',title:'Comment modifier mon adresse ?',channel:'Chat web',urgent:false,status:'Résolu par IA',type:'Compte',date:'10 nov. · 10:19'},{id:'R-1035',who:'Claire Renard',title:'Récupérer un justificatif',channel:'Chat web',urgent:false,status:'Résolu par IA',type:'Documents',date:'10 nov. · 10:29'},{id:'R-1036',who:'Yann Leconte',title:'Changement de formule',channel:'Chat web',urgent:false,status:'Résolu par IA',type:'Contrat',date:'10 nov. · 10:35'},{id:'R-1037',who:'Julie Morin',title:'Question sur une facture',channel:'Chat web',urgent:false,status:'Résolu par IA',type:'Facturation',date:'10 nov. · 10:41'}];const docs=[{title:'FAQ · Suivi et livraison',cat:'Livraison',updated:'8 nov. 2026',detail:'Vérification du statut de livraison et modalités de suivi.'},{title:'Grille des offres',cat:'Commercial',updated:'7 nov. 2026',detail:'Services, disponibilités et questions fréquentes.'},{title:'Guide d’accès au compte',cat:'Support',updated:'5 nov. 2026',detail:'Modification des coordonnées et récupération des accès.'},{title:'Procédure d’incident critique',cat:'Urgence',updated:'9 nov. 2026',detail:'Alerter l’astreinte à toute heure, ne pas inventer de date de rétablissement, transmettre un résumé et attendre confirmation.'},{title:'Politique de facturation',cat:'Facturation',updated:'2 nov. 2026',detail:'Factures, duplicatas et modification des informations.'}];const etatInitial=()=>({page:'dashboard',step:0,tickets:structuredClone(initialTickets),actions:[],search:'',filter:'Tous',lastToast:'',autoCount:8,humanCount:2});let state=etatInitial();const $=id=>document.getElementById(id);function notify(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(window._to);window._to=setTimeout(()=>$('toast').classList.add('hidden'),2400)}function route(id){state.page=id;render();window.scrollTo(0,0)}function resetDemo(){state=etatInitial();render();notify('Démonstration réinitialisée')}function setStep(n){state.step=n;let t=state.tickets.find(x=>x.id==='R-1030');t.status=['À qualifier','Analyse IA','Transfert préparé','En cours de prise en charge','Pris en charge'][n];if(n>=2&&!state.actions.some(x=>x.id==='alert'))state.actions.unshift({id:'alert',title:'Message d’équipe + email préparés',detail:'Astreinte support · 02:17',kind:'simulés'});if(n>=3&&!state.actions.some(x=>x.id==='ack'))state.actions.unshift({id:'ack',title:'Astreinte informée (simulation)',detail:'Notification interne et email',kind:'simulés'});if(n>=4&&!state.actions.some(x=>x.id==='handled'))state.actions.unshift({id:'handled',title:'Demande prise en charge',detail:'Intervention de Camille Dumas',kind:'simulé'});render()}function nextStep(){setStep(Math.min(4,state.step+1))}function nav(){return navs.map(([id,icon,label])=>`<button class="${state.page===id?'active':''}" onclick="route('${id}')"><span class="ico">${icon}</span>${label}</button>`).join('')}function frame(title,subtitle,extra=''){return `<div class="heading"><div><div class="eyebrow">Espace démo · Accueil 24 h · Relation client</div><h2>${title}</h2><div class="muted">${subtitle}</div></div>${extra}</div>`}function rowTicket(t){return `<div class="ticket" onclick="route('scenario');setStep(${t.id==='R-1030'?state.step:0})"><div><strong>${t.title}</strong><span class="mini">${t.who} · ${t.id} · ${t.date}</span></div><span class="status ${t.urgent?'urgent':'good'}">${t.status}</span></div>`}function dashboard(){return `${frame('Une relation client qui reste disponible, y compris hors des heures d’ouverture, avec relecture humaine','L’IA traite les questions fréquentes. Votre équipe intervient dès qu’une demande exige son expertise.',`<button class="btn" onclick="route('scenario')">▶ Voir la demande urgente</button>`)}<div class="grid4"><div class="panel metric"><div class="label">Demandes reçues · jeu d’essai</div><div class="value">10</div><div class="hint">Historique local de démonstration</div></div><div class="panel metric"><div class="label">Réponses IA</div><div class="value">8 <small style="font-size:15px;color:var(--texte-secondaire)">/ 10</small></div><div class="hint">Réponses courantes résolues</div></div><div class="panel metric"><div class="label">Intervention humaine</div><div class="value">2 <small style="font-size:15px;color:var(--texte-secondaire)">/ 10</small></div><div class="hint">Exemple de répartition 80 / 20</div></div><div class="panel metric"><div class="label">Couverture du chatbot</div><div class="value">Hors horaires</div><div class="hint">Transfert d’astreinte configurable</div></div></div><div class="contentgrid"><div class="panel"><h3 class="section-title">Traitement des demandes <span class="tag">exemple</span></h3><div class="ratio"><div><div class="mini">Traité automatiquement</div><strong style="color:var(--terracotta)">80 %</strong></div><div style="text-align:right"><div class="mini">Transmis à l’humain</div><strong style="color:var(--orange)">20 %</strong></div></div><div class="splitbar"><div class="auto"></div><div class="human"></div></div><p class="mini">Répartition illustrative sur 10 demandes sélectionnées, pas un résultat mesuré chez un client. Le taux dépend de la base documentaire et des règles métier.</p><h3 class="section-title" style="margin-top:26px">Demandes à surveiller</h3><div class="stack">${state.tickets.filter(x=>x.urgent).map(rowTicket).join('')}</div></div><div class="panel"><h3 class="section-title">Ce qui se passe automatiquement</h3><div class="timeline"><div class="event"><div class="dot">✓</div><div><strong>Question habituelle</strong><div class="mini">Recherche dans la FAQ, réponse immédiate fondée sur les documents</div></div></div><div class="event"><div class="dot">✦</div><div><strong>Besoin d’un collaborateur</strong><div class="mini">Résumé, priorité, attribution et préparation des deux alertes</div></div></div><div class="event"><div class="dot">☾</div><div><strong>Demande reçue à 02:17</strong><div class="mini">Le chatbot accueille le client hors des heures d’ouverture ; l’astreinte est sollicitée suivant les règles configurées</div></div></div></div><div class="help">Le chatbot peut accueillir un client hors des heures d’ouverture. Une réponse humaine immédiate dépend de l’organisation effective de l’astreinte.</div><button class="btn" style="margin-top:20px" onclick="route('scenario')">Voir le traitement de 02:17 →</button></div></div>`}function scenario(){let steps=['Message à 02:17','Analyse de l’IA','Alertes préparées','Astreinte avertie','Reprise humaine'];let messages=[`Bonjour, notre service est inaccessible et notre équipe ne peut plus travailler. Nous avons besoin d’aide rapidement.`,`Je comprends que la situation est bloquante. Je transmets votre demande en priorité à notre équipe d’astreinte.`,`Votre demande a été signalée. Un collaborateur prendra le relais selon les disponibilités du service d’astreinte.`];return `${frame('02:17 : une urgence hors des heures d’ouverture','Un seul parcours filmable : le chatbot reconnaît ses limites, alerte et organise la reprise humaine.',`<div class="actions"><button class="btn secondary" onclick="setStep(0)">↺ Recommencer</button><button class="btn" onclick="nextStep()" ${state.step===4?'disabled':''}>${state.step===4?'Parcours terminé':'Étape suivante →'}</button></div>`)}<div class="workflow">${steps.map((s,i)=>`<div class="step ${i<state.step?'done':i===state.step?'active':''}"><div class="num">0${i+1} ${i<state.step?'✓':i===state.step?'●':''}</div><strong>${s}</strong><span class="mini">${['Demande reçue','Urgence détectée','Email + message d’équipe','Notification simulée','Ticket mis à jour'][i]}</span></div>`).join('')}</div><div class="demo-grid"><div class="panel"><h3 class="section-title">Site web · Assistance en ligne <span class="status good">Disponible hors des heures d’ouverture</span></h3><div class="chatwrap"><div class="chatheader">✦ Espace démo · Accueil 24 h · Assistant client <span style="float:right;color:var(--reussite)">● En ligne</span></div><div class="chatbody"><div class="bubble">Bonjour, comment pouvons-nous vous aider ?</div><div class="bubble client">${messages[0]}</div>${state.step>=1?`<div class="bubble">${messages[1]}</div>`:''}${state.step>=3?`<div class="bubble">${messages[2]}</div>`:''}${state.step>=4?`<div class="bubble">Camille, de notre équipe, a pris en charge votre demande. Nous vous tiendrons informé après vérification.</div>`:''}</div><div class="chatinput"><input placeholder="Conversation de démonstration · envoi désactivé" disabled><button class="btn secondary" onclick="notify('Messagerie simulée : aucun envoi réel')">➤</button></div></div><div class="help">Le chatbot ne promet pas une résolution automatique quand le problème exige une intervention humaine.</div></div><div class="panel"><h3 class="section-title">✦ Décisions visibles de l’IA</h3><div class="stack"><div class="event"><div class="dot">1</div><div><strong>Comprendre le problème</strong><div class="mini">Accès au service impossible · travail de l’équipe bloqué</div></div></div>${state.step>=1?`<div class="event"><div class="dot">2</div><div><strong class="purple">Incident prioritaire détecté</strong><div class="mini">Source : Procédure d’incident critique · vérification du contexte</div></div></div>`:''}${state.step>=2?`<div class="event"><div class="dot">3</div><div><strong>Deux alertes préparées</strong><div class="mini">Message d’équipe à l’astreinte + email récapitulatif</div></div></div>`:''}${state.step>=3?`<div class="event"><div class="dot">4</div><div><strong>Notification déclenchée (simulation)</strong><div class="mini">Aucune notification externe envoyée</div></div></div>`:''}${state.step>=4?`<div class="event"><div class="dot">5</div><div><strong>Camille prend en charge</strong><div class="mini">Ticket R-1030 mis à jour · client informé</div></div></div>`:''}</div>${state.step>=2?`<div class="alertbox" style="margin-top:17px"><strong>▲ Alerte critique · 02:17</strong><div class="mini">Incident bloquant · personne d’astreinte · intervention humaine requise</div><div class="actions"><button class="btn secondary" onclick="route('alerts')">Ouvrir les alertes email et message d’équipe</button></div></div>`:`<div class="help">Clique sur « Étape suivante » pour voir l’analyse puis les transferts préparés.</div>`}</div></div><div class="panel" style="margin-top:16px"><strong>État du ticket R-1030 :</strong> <span class="status ${state.step>=2?'urgent':''}">${state.tickets.find(x=>x.id==='R-1030').status}</span><span class="mini"> · Toutes les transitions sont simulées et réinitialisables pour le tournage.</span></div>`}function alerts(){let on=state.step>=2;return `${frame('Alertes et reprise humaine','Email + message d’équipe pour une demande prioritaire, y compris à 02:17.',`<button class="btn" onclick="route('scenario');setStep(2)">Préparer les alertes</button>`)}<div class="layout-2"><div class="panel"><h3 class="section-title">✈ Message d’équipe · Astreinte</h3><div class="tag">Canal d’alerte · simulation</div><div class="draft"><strong>INCIDENT PRIORITAIRE — R-1030</strong>\nHeure : 02:17\nClient : Sarah Perrin\nMotif : service inaccessible, activité bloquée\nNiveau : critique\nAction : vérifier l’incident et reprendre le ticket\nRéponse client : en attente de confirmation</div><div class="actions"><button class="btn secondary" onclick="setStep(3);route('alerts')">${state.step>=3?'✓ Notification simulée':'Simuler la notification d’équipe'}</button><button class="btn outline" onclick="setStep(4);route('alerts')">Prendre en charge</button></div></div><div class="panel"><h3 class="section-title">✉ Email · Équipe support</h3><div class="tag">Brouillon · aucun email réel</div><div class="draft"><strong>Objet : [PRIORITÉ] Incident bloquant — R-1030</strong>\nÀ : astreinte@exemple.invalid\n\nUne demande prioritaire a été reçue à 02:17.\n\nRésumé : client bloqué par l’indisponibilité d’un service.\nProcédure : vérifier l’état du service, rappeler le client selon l’astreinte, renseigner le ticket.\n\nSource : procédure d’incident critique.</div><div class="actions"><button class="btn secondary" onclick="setStep(3);route('alerts')">${state.step>=3?'✓ Email simulé':'Simuler l’alerte email'}</button><button class="btn outline" onclick="route('scenario')">Revoir la conversation</button></div></div></div><div class="panel" style="margin-top:16px"><h3 class="section-title">Journal d’escalade</h3><div class="stack"><div class="event"><div class="dot">!</div><div><strong>02:17 · Règle d’astreinte activée</strong><div class="mini">Le canal de message d’équipe et l’email sont configurés dans la simulation.</div></div></div>${state.actions.map(a=>`<div class="event"><div class="dot">✓</div><div><strong>${a.title}</strong><div class="mini">${a.detail} · ${a.kind}</div></div></div>`).join('')}</div><div class="help">En production, l’envoi hors des heures d’ouverture nécessite des connecteurs effectifs, une astreinte disponible, et une politique d’escalade si personne n’accuse réception.</div></div>`}function conversations(){let tickets=state.tickets.filter(t=>(state.filter==='Tous'||(state.filter==='IA'?!t.urgent:t.urgent))&&`${t.title} ${t.who} ${t.id}`.toLowerCase().includes(state.search.toLowerCase()));return `${frame('Toutes les conversations','Recherche, filtres et historique synchronisés avec le parcours d’urgence.')}<div class="panel"><div class="layout-2" style="margin-bottom:10px"><input class="search" placeholder="Rechercher une demande, un client, un numéro…" value="${state.search}" oninput="state.search=this.value;renderTable()"><select class="filter" onchange="state.filter=this.value;renderTable()"><option ${state.filter==='Tous'?'selected':''}>Tous</option><option ${state.filter==='IA'?'selected':''}>IA</option><option ${state.filter==='Humain'?'selected':''}>Humain</option></select></div><div id="ticket-table">${ticketTable(tickets)}</div></div>`}function ticketTable(tickets){return `<table class="table"><thead><tr><th>Dossier</th><th>Contact</th><th>Motif</th><th>Traitement</th></tr></thead><tbody>${tickets.map(t=>`<tr><td>${t.id}</td><td>${t.who}</td><td>${t.title}</td><td><span class="status ${t.urgent?'urgent':'good'}">${t.status}</span></td></tr>`).join('')}</tbody></table>${tickets.length?'':'<p>Aucun résultat pour cette recherche.</p>'}`}function renderTable(){let ts=state.tickets.filter(t=>(state.filter==='Tous'||(state.filter==='IA'?!t.urgent:t.urgent))&&`${t.title} ${t.who} ${t.id}`.toLowerCase().includes(state.search.toLowerCase()));$('ticket-table').innerHTML=ticketTable(ts)}function knowledge(){return `${frame('Base de connaissances','Les réponses automatiques s’appuient sur des documents précis ; les urgences sont transférées.')}<div class="grid4" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${docs.map(d=>`<div class="panel"><div class="tag">${d.cat}</div><h3 style="font-size:16px">${d.title}</h3><p>${d.detail}</p><div class="mini">Mis à jour : ${d.updated}</div><button class="btn outline" style="margin-top:15px" onclick="notify('Source consultée : ${d.title.replace(/'/g,'’')}')">Consulter la source</button></div>`).join('')}</div><div class="help">Une réponse incertaine n’est pas inventée : le chatbot demande une précision ou crée un transfert à l’équipe.</div>`}function analytics(){return `${frame('Analyses et performances','Jeu d’essai représentatif du fonctionnement du parcours, sans promesse de rendement.')}<div class="grid4"><div class="panel metric"><div class="label">Demandes observées</div><div class="value">10</div></div><div class="panel metric"><div class="label">Traitement par l’IA</div><div class="value">8</div></div><div class="panel metric"><div class="label">Transferts humains</div><div class="value">2</div></div><div class="panel metric"><div class="label">Exemple de répartition</div><div class="value">80 / 20</div></div></div><div class="contentgrid"><div class="panel"><h3 class="section-title">Activité hebdomadaire · <span class="tag">exemple</span></h3><div class="chart">${[42,57,48,79,62,91,73].map((x,i)=>`<div class="bar" style="height:${x}%"><span>${['L','M','M','J','V','S','D'][i]}</span></div>`).join('')}</div><p class="mini" style="margin-top:34px">Série d’exemple, valeurs fictives et non mesurées, indépendante du jeu de 10 conversations.</p></div><div class="panel"><h3 class="section-title">Pourquoi une demande est transférée ?</h3><div class="timeline"><div class="event"><div class="dot">!</div><div><strong>Incident important ou bloquant</strong><div class="mini">Alerte message d’équipe + email selon niveau d’urgence</div></div></div><div class="event"><div class="dot">?</div><div><strong>Information insuffisante</strong><div class="mini">Résumé préparé pour validation humaine</div></div></div><div class="event"><div class="dot">✓</div><div><strong>Question documentée</strong><div class="mini">Réponse proposée automatiquement</div></div></div></div></div></div>`}function settings(){return `${frame('Paramètres de service','La messagerie et les notifications sont uniquement simulées dans cette version locale.')}<div class="layout-2"><div class="panel"><h3 class="section-title">Identité du logiciel</h3><p><strong>Produit :</strong> Espace démo · Accueil 24 h</p><p><strong>Entreprise utilisatrice :</strong> Entreprise exemple</p><p><strong>Disponibilité chatbot :</strong> hors des heures d’ouverture, avec relecture humaine</p><p><strong>Réponses :</strong> sources vérifiables, transfert si incertain</p><div class="help">Noms neutres : produit et entreprise de démonstration, sans marque réelle.</div></div><div class="panel"><h3 class="section-title">Escalade et astreinte</h3><p><strong>Email de démonstration :</strong> astreinte@exemple.invalid</p><p><strong>Message d’équipe :</strong> alerte (simulation)</p><p><strong>Règle :</strong> urgence critique → alerte immédiate, selon la règle d’astreinte</p><p><strong>Reprise :</strong> assignation humaine et confirmation</p><button class="btn outline" onclick="route('alerts')">Voir les deux canaux</button></div></div>`}function render(){ $('nav').innerHTML=nav();$('top-title').textContent=(navs.find(x=>x[0]===state.page)||navs[0])[2];$('view').innerHTML=({dashboard,scenario,conversations,alerts,knowledge,analytics,settings}[state.page]||dashboard)()}render();
const ETAPES={message:0,analyse:1,alertes:2,astreinte:3,reprise:4};
window.demoMaquette={aller(id){if(!Object.prototype.hasOwnProperty.call(ETAPES,id))throw new Error('étape inconnue : '+id);state.page='scenario';setStep(ETAPES[id]);window.scrollTo(0,0)},reinitialiser(){clearTimeout(window._to);$('toast').classList.add('hidden');state=etatInitial();render();window.scrollTo(0,0)}};
</script></body></html>
