radius:11px;padding:10px 14px;color:#3b281c;font-weight:800}.body{padding:25px 32px 42px;max-width:1600px;margin:auto}.bread{font-size:12px;color:#8b8076;margin-bottom:23px}.bread strong{color:var(--orange)}.grid{display:grid;gap:17px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.cols{grid-template-columns:minmax(0,1.18fr) minmax(0,1fr)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:23px;box-shadow:0 5px 22px #3d261508;min-width:0}.panel h2{font-size:17px;letter-spacing:-.35px;margin:0 0 6px}.panel .desc{color:var(--sub);font-size:13px;margin:0 0 20px}.metric{min-height:142px}.metric .label{display:flex;gap:8px;color:var(--sub);align-items:center}.metric .label span{font-size:22px}.metric .num{font-size:38px;font-weight:820;letter-spacing:-1.5px;margin-top:16px}.metric .trend{color:var(--green);font-size:12px;margin-top:5px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.btn{border:1px solid #ddd4ca;padding:9px 13px;border-radius:9px;background:white;color:var(--ink);font-weight:650}.btn:hover{border-color:var(--orange);background:#fff8f4}.btn.primary{background:var(--orange);color:white;border-color:var(--orange)}.btn.primary:hover{background:#8e3110}.btn.small{padding:6px 10px;font-size:12px}.badge{border-radius:99px;padding:5px 9px;font-size:11px;font-weight:700;background:#f4ebe2;color:#9c4f29;white-space:nowrap}.badge.ok{background:#eaf5ee;color:var(--green)}.badge.warn{background:#fff1db;color:#a45e10}.badge.info{background:#e8e6dc;color:#5e5d59}.listrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}.grow{flex:1;min-width:0}.sub{color:var(--sub);font-size:12px;line-height:1.6}.strong{font-weight:740}.modulegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.module{background:#fcfaf7;border:1px solid var(--line);border-radius:12px;text-align:left;padding:16px}.module:hover{border-color:var(--orange);transform:translateY(-1px)}.module .symbol{font-size:24px;color:var(--orange);margin-bottom:7px}.svgchart{width:100%;height:270px}.blocksp{margin-top:17px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:19px}.sectionhead h2{font-size:21px;margin:0}.table{width:100%;border-collapse:collapse}.table th{text-align:left;font-size:11px;color:var(--sub);font-weight:700;background:#faf8f4;padding:13px}.table td{padding:14px 13px;border-bottom:1px solid var(--line);vertical-align:middle}.table tr:last-child td{border-bottom:0}.progress{height:8px;background:var(--sand);border-radius:30px;overflow:hidden}.progress>i{display:block;background:var(--orange);height:100%;border-radius:30px}.bar{display:flex;align-items:center;gap:9px}.bar .progress{flex:1}.field{border:1px solid #ded6cd;padding:11px;border-radius:9px;background:white;width:100%;outline-color:var(--orange)}label{display:block;font-size:12px;font-weight:700;color:#61584f;margin:12px 0 7px}.detail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.empty{padding:30px;text-align:center;color:var(--sub)}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}.chat{height:350px;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:8px 2px}.bubble{padding:12px 15px;border-radius:13px;max-width:80%;line-height:1.6;background:#f1ede8;align-self:flex-start}.bubble.user{background:#f5e0d5;align-self:flex-end}.chatinput{display:flex;gap:8px}.chatinput input{flex:1}.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.modalback{position:fixed;inset:0;background:#18130e85;display:grid;place-items:center;padding:20px;z-index:30}.modal{background:white;border-radius:17px;padding:27px;width:min(540px,100%);box-shadow:0 30px 100px #0004}.modal h2{margin:0 0 10px}.modal p{color:var(--sub);line-height:1.7}.toast{position:fixed;bottom:22px;right:24px;background:#2a2520;color:#fff;padding:14px 21px;border-radius:11px;box-shadow:0 10px 30px #0002;z-index:50}.help{font-size:12px;color:var(--sub);margin:14px 0}.hide{display:none}.check{accent-color:var(--orange);width:17px;height:17px}.spacer{height:16px}.pilltab{border:none;background:#f3ede5;border-radius:10px;padding:10px 15px}.pilltab.sel{background:var(--orange);color:white}.mobilemenu{display:none}.footer{text-align:center;color:var(--sub);font-size:11px;padding:20px}.filterline{display:flex;gap:10px;margin-bottom:17px;flex-wrap:wrap}.filterline input{max-width:360px}.clickable{cursor:pointer}.clickable:hover{color:var(--orange)}.timeline{border-left:2px solid #ead5c6;margin:18px 0 0 8px;padding:0 0 0 22px}.event{padding:0 0 26px;position:relative}.event:before{content:'';width:11px;height:11px;position:absolute;left:-29px;top:3px;background:var(--orange);border-radius:100%}@media(max-width:1160px){.kpis{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.search{width:220px}}@media(max-width:730px){.side{display:none;position:fixed;z-index:20}.side.open{display:flex}.top{padding:18px}.body{padding:18px}.top h1{font-size:22px}.top p{display:none}.search{display:none}.mobilemenu{display:inline-flex}.kpis,.detail,.twocol,.cards3{grid-template-columns:1fr}.modulegrid{grid-template-columns:1fr}.table{display:block;overflow-x:auto}.tools{gap:5px}}

</head><body><div class="mention-demo">Démonstration · données fictives</div><div id="app"></div><script>
const pages=[['home','⌂','Vue d’ensemble'],['audit','◉','Audit IA'],['knowledge','▱','Base de connaissances'],['chatbot','▤','Assistant IA'],['blog','▣','Blog & SEO'],['agents','✧','Agents IA'],['automations','⌘','Automatisations'],['documents','▧','Documents'],['team','♧','Équipe'],['settings','⚙','Paramètres']];
const names={home:'Vue d’ensemble',audit:'Audit IA',knowledge:'Base de connaissances',chatbot:'Assistant IA',blog:'Blog & SEO',agents:'Agents IA',automations:'Automatisations',documents:'Documents',team:'Équipe',settings:'Paramètres'};
const subtitle={home:'Votre activité en un seul endroit',audit:'Transformez vos processus en opportunités concrètes',knowledge:'Les informations qui alimentent votre assistant',chatbot:'Testez les réponses de votre assistant client',blog:'Pilotez votre présence sur les moteurs de recherche',agents:'Vos assistants numériques spécialisés',automations:'Vos processus fonctionnent en continu',documents:'Vos ressources centralisées',team:'Les personnes qui pilotent votre espace',settings:'Personnalisez votre expérience'};
const state={page:'home',time:'3 mois',filter:'Tous',knowledgeFilter:'Tous',tasks:[false,false,false,false],notifications:3,articles:[{title:'Comment accélérer les réponses aux demandes clients',state:'À relire',channel:'Blog',date:'10 nov. 2026'},{title:'5 étapes pour réduire les ressaisies administratives',state:'Programmé',channel:'Blog',date:'12 nov. 2026'},{title:'Structurer ses informations pour mieux répondre',state:'Publié',channel:'Blog',date:'5 nov. 2026'},{title:'Automatiser sans perdre le contrôle humain',state:'Brouillon',channel:'Blog',date:'7 nov. 2026'}],docs:[{name:'Rapport de diagnostic',type:'PDF',date:'04 nov. 2026'},{name:'Cartographie des processus',type:'PDF',date:'05 nov. 2026'},{name:'Plan d’action priorisé',type:'PDF',date:'06 nov. 2026'},{name:'Guide de prise en main',type:'PDF',date:'07 nov. 2026'}],kn:[{name:'Présentation de l’entreprise',category:'Entreprise',updated:'Aujourd’hui',health:100},{name:'Offres et prestations',category:'Commercial',updated:'Aujourd’hui',health:97},{name:'Questions fréquentes',category:'Support',updated:'Hier',health:94},{name:'Conditions de service',category:'Juridique',updated:'Il y a 3 jours',health:82},{name:'Procédures internes',category:'Entreprise',updated:'Hier',health:91}],autos:[{name:'Tri des demandes entrantes',state:'Active',runs:158,success:99},{name:'Relance des devis en attente',state:'Active',runs:71,success:98},{name:'Synthèse quotidienne des e-mails',state:'Active',runs:22,success:100},{name:'Préparation des fiches clients',state:'En pause',runs:36,success:97}],messages:[{me:false,text:'Bonjour ! Je suis votre assistant de démonstration. Posez-moi une question sur les offres, les horaires ou le suivi d’une demande.'}],activity:['158 demandes entrantes triées (exemple)','Base de connaissances mise à jour','Article transmis en relecture','Synthèse quotidienne envoyée'],toggles:{digest:true,approval:true,alerts:true}};
const $=id=>document.getElementById(id);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=(s)=>`<span class="badge ${/Active|Publié|Terminé|Validé|Disponible|Synchronisé/.test(s)?'ok':/À relire|À vérifier|En pause|Alerte/.test(s)?'warn':'info'}">${esc(s)}</span>`;
const btn=(s,a,cl='')=>`<button class="btn ${cl}" onclick="${a}">${s}</button>`;let tm;
function toast(msg){let t=$('toast');t.textContent=msg;t.classList.remove('hide');clearTimeout(tm);tm=setTimeout(()=>t.classList.add('hide'),3300)}
function go(page){state.page=page;location.hash=page;render();window.scrollTo({top:0,behavior:'instant'});if($('side'))$('side').classList.remove('open')}
function modal(title,html){$('modal').innerHTML=`<div class="modal"><div class="row"><h2>${title}</h2><button class="btn" onclick="closeModal()">✕</button></div>${html}</div>`;$('modal').classList.remove('hide')}
function closeModal(){$('modal').classList.add('hide')}
function demoNotice(a){modal(a,`<p>Cette fonction est simulée dans cette démonstration. Aucun service extérieur n’est appelé et aucune donnée réelle n’est modifiée.</p>${btn('Compris','closeModal()','primary')}`)}
function chart(){let vals=state.time==='7 jours'?[82,130,113,152,180,205,248]:state.time==='12 mois'?[40,60,85,92,105,127,144,160,177,196,224,248]:[100,153,205,248];let coords=vals.map((n,i)=>[46+i*540/(vals.length-1),240-(n/280)*210]);let line=coords.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' ');let area=line+` L${coords.at(-1)[0]} 240 L46 240 Z`;return `<svg class="svgchart" viewBox="0 0 625 270" role="img" aria-label="Graphique fictif des demandes traitées">${[0,70,140,210,280].map(n=>`<line x1="46" y1="${240-n/280*210}" x2="590" y2="${240-n/280*210}" stroke="#ede7e0"/><text x="14" y="${244-n/280*210}" font-size="11" fill="#83786c">${n}</text>`).join('')}<path d="${area}" fill="#b23f16" fill-opacity=".10"/><path d="${line}" fill="none" stroke="#b23f16" stroke-width="3" stroke-linecap="round"/>${coords.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#b23f16" stroke="white" stroke-width="2"/>`).join('')}<text x="50" y="265" fill="#83786c" font-size="11">Début de période</text><text x="490" y="265" fill="#83786c" font-size="11">Aujourd’hui</text></svg>`}
const panel=(title,body,desc='')=>`<section class="panel"><h2>${title}</h2>${desc?`<p class="desc">${desc}</p>`:''}${body}</section>`;
function home(){return `<div class="grid kpis">${[['⚙','Automatisations actives','3','+ 12 % ce mois · exemple'],['▤','Demandes traitées','248','+ 24 % ce mois · exemple'],['◷','Temps estimé libéré','97 h','Valeur d’exemple, estimation illustrative'],['☑','Actions à valider','4','2 prioritaires']].map(a=>`<div class="panel metric"><div class="label"><span>${a[0]}</span>${a[1]}</div><div class="num">${a[2]}</div><div class="trend">${a[3]}</div></div>`).join('')}</div><div class="grid cols"><div>${panel('Activité de votre entreprise',`<div class="row"><span class="sub">Demandes traitées • chiffres de démonstration</span><select class="btn" onchange="state.time=this.value;render()">${['7 jours','3 mois','12 mois'].map(x=>`<option ${state.time===x?'selected':''}>${x}</option>`).join('')}</select></div>${chart()}`)}<div class="blocksp">${panel('Vos actions prioritaires', ['Valider les fiches Knowledge','Relire le prochain article','Vérifier les réponses de l’assistant','Approuver la prochaine automatisation'].map((t,i)=>`<div class="listrow"><input type="checkbox" class="check" ${state.tasks[i]?'checked':''} onchange="state.tasks[${i}]=this.checked;toast('Action mise à jour')"><div class="grow strong" style="${state.tasks[i]?'text-decoration:line-through;opacity:.5':''}">${t}</div>${badge(state.tasks[i]?'Validé':i<2?'À relire':'À vérifier')}</div>`).join(''))}</div></div><div>${panel('Vos modules',`<div class="modulegrid">${[['audit','◉','Diagnostic détaillé'],['knowledge','▱','5 sources indexées'],['chatbot','▤','Assistant disponible'],['blog','▣','4 articles suivis'],['agents','✧','3 agents spécialisés'],['automations','⌘','4 processus configurés']].map(a=>`<button class="module" onclick="go('${a[0]}')"><div class="symbol">${a[1]}</div><div class="strong">${names[a[0]]} ↗</div><div class="sub">${a[2]}</div></button>`).join('')}</div>`)}<div class="blocksp">${panel('Activité récente',state.activity.map((a,i)=>`<div class="listrow"><span style="color:var(--orange);font-size:21px">${['✓','↻','▣','◷'][i]}</span><div class="grow">${a}<div class="sub">${i===0?'Il y a 12 minutes':i===1?'Il y a 1 heure':i===2?'Hier':'Hier'}</div></div></div>`).join(''))}</div></div></div>`}
function audit(){let tasks=[['Tri des e-mails entrants',16,4,'Rapide à tester'],['Relances commerciales',10,3,'Fort potentiel'],['Création de comptes rendus',8,2,'Rapide à tester'],['Saisie des données clients',14,4,'À cadrer']];return `<div class="grid kpis">${[['Processus analysés','12'],['Opportunités détectées','8'],['À prioriser','4'],['État du diagnostic','Finalisé']].map(a=>`<div class="panel metric"><div class="label">${a[0]}</div><div class="num" style="font-size:30px">${a[1]}</div></div>`).join('')}</div>${panel('Votre plan d’action priorisé',`<div class="row" style="margin-bottom:15px"><p class="sub">Estimations fictives destinées à illustrer une interface client.</p>${btn('Voir le rapport','openDocument(0)','primary')}</div><table class="table"><thead><tr><th>Processus</th><th>Temps manuel / semaine</th><th>Potentiel de réduction estimé</th><th>Priorité</th><th></th></tr></thead><tbody>${tasks.map((a,i)=>`<tr><td class="strong">${a[0]}</td><td>${a[1]} h</td><td><div class="bar"><div class="progress"><i style="width:${[75,60,68,40][i]}%"></i></div>${[75,60,68,40][i]} %</div></td><td>${badge(a[3])}</td><td>${btn('Détails',`showAudit(${i})`,'small')}</td></tr>`).join('')}</tbody></table>`)}<div class="grid twocol blocksp">${panel('Parcours de mise en œuvre',`<div class="timeline">${[['Diagnostic','Terminé'],['Validation des priorités','En cours'],['Mise en place','À venir'],['Mesure des résultats','À venir']].map(a=>`<div class="event"><div class="strong">${a[0]}</div>${badge(a[1])}</div>`).join('')}</div>`)}${panel('Livrables disponibles',`<div class="listrow"><div class="grow">Diagnostic complet</div>${btn('Consulter','openDocument(0)','small')}</div><div class="listrow"><div class="grow">Cartographie des processus</div>${btn('Consulter','openDocument(1)','small')}</div><div class="listrow"><div class="grow">Plan d’action priorisé</div>${btn('Consulter','openDocument(2)','small')}</div>`)}</div>`}
function showAudit(i){let a=['Tri des e-mails entrants','Relances commerciales','Création de comptes rendus','Saisie des données clients'][i];modal(a,`<p><b>Situation actuelle :</b> tâches répétitives, saisies et contrôles manuels.</p><p><b>Piste proposée :</b> assistance par IA avec validation humaine avant toute action sensible.</p><p><b>Étape suivante :</b> atelier de cadrage et test sur un échantillon.</p><p class="sub">Exemple fictif : aucun résultat ni gain n’est garanti.</p>${btn('Demander une étude',"closeModal();toast('Demande de démonstration enregistrée localement')",'primary')}`)}
function knowledge(){let cats=['Tous','Entreprise','Commercial','Support','Juridique'];let data=state.kn.filter(x=>state.knowledgeFilter==='Tous'||x.category===state.knowledgeFilter);return `${panel('Pilotage de votre base de connaissances',`<div class="grid detail">${[['Fiches disponibles','5'],['Qualité moyenne','93 % · exemple'],['Dernière synchronisation','Aujourd’hui']].map(a=>`<div class="panel" style="background:#fcfaf7"><div class="sub">${a[0]}</div><div style="font-size:24px;font-weight:800;margin-top:10px">${a[1]}</div></div>`).join('')}</div><div class="spacer"></div><div class="filterline"><select class="btn" onchange="state.knowledgeFilter=this.value;render()">${cats.map(x=>`<option ${state.knowledgeFilter===x?'selected':''}>${x}</option>`).join('')}</select>${btn('+ Ajouter une fiche',"editKnowledge()",'primary')}${btn('Synchroniser',"toast('Synchronisation simulée : données inchangées')")}</div><table class="table"><thead><tr><th>Source</th><th>Catégorie</th><th>Dernière mise à jour</th><th>Qualité indicative (exemple)</th><th>Action</th></tr></thead><tbody>${data.map(a=>`<tr><td class="strong">${esc(a.name)}</td><td>${a.category}</td><td>${a.updated}</td><td><div class="bar"><div class="progress"><i style="width:${a.health}%"></i></div>${a.health} %</div></td><td>${btn('Consulter',`knowledgeDetail('${a.name.replaceAll("'","\\'")}')`,'small')}</td></tr>`).join('')}</tbody></table>`)}<p class="help">Les scores ci-dessus sont illustratifs ; ils ne constituent pas une mesure réelle de fiabilité.</p>`}
function editKnowledge(){modal('Nouvelle fiche',`<label>Nom de la fiche</label><input class="field" id="knname" placeholder="Ex. Politique de retours"><label>Catégorie</label><select id="kncat" class="field"><option>Support</option><option>Entreprise</option><option>Commercial</option><option>Juridique</option></select><label>Contenu</label><textarea id="knbody" class="field" rows="4" placeholder="Décrivez votre information..."></textarea><div class="spacer"></div>${btn('Enregistrer localement','saveKn()','primary')}`)}
function saveKn(){let n=$('knname').value.trim();if(!n)return toast('Saisissez un nom');state.kn.push({name:n,category:$('kncat').value,updated:'À l’instant',health:85});closeModal();render();toast('Fiche ajoutée dans la démonstration')}
function knowledgeDetail(name){modal(esc(name),`<p>Cette fiche rassemble les informations de référence utilisées pour assister les collaborateurs et répondre aux questions fréquentes.</p><label>Dernière vérification</label><p>${new Date().toLocaleDateString('fr-FR')}</p>${btn('Marquer comme vérifiée',"closeModal();toast('Vérification simulée')",'primary')}`)}
function chatbot(){return `<div class="grid cols">${panel('Aperçu de votre assistant',`<div class="row"><span>${badge('Disponible')}</span>${btn('Réinitialiser','resetChat()','small')}</div><div class="chat" id="chat">${state.messages.map(x=>`<div class="bubble ${x.me?'user':''}">${esc(x.text)}</div>`).join('')}</div><div class="chatinput"><input class="field" id="msg" placeholder="Écrivez une question..." onkeydown="if(event.key==='Enter')sendChat()">${btn('Envoyer','sendChat()','primary')}</div><p class="help">Simulation locale : aucune connexion à un modèle d’IA ni aucune donnée externe.</p>`)}<div>${panel('Questions rapides',`<div class="grid">${['Quels sont vos horaires ?','Comment demander un devis ?','Comment suivre ma demande ?','Puis-je parler à une personne ?'].map(q=>btn(q,`quickAsk(${JSON.stringify(q)})`)).join('')}</div>`)}<div class="blocksp">${panel('Configuration illustrée',`<div class="listrow"><div class="grow">Réponses issues de Knowledge</div>${badge('Activé')}</div><div class="listrow"><div class="grow">Transfert vers un humain</div>${badge('Activé')}</div><div class="listrow"><div class="grow">Journal des conversations</div>${badge('Activé')}</div>${btn('Voir les paramètres',"go('settings')")}`)}</div></div>`}
function resetChat(){state.messages=state.messages.slice(0,1);render();toast('Conversation réinitialisée')}
function quickAsk(q){$('msg').value=q;sendChat()}
function sendChat(){let el=$('msg');if(!el||!el.value.trim())return;let q=el.value.trim();let a=/horaire/i.test(q)?'Notre équipe est disponible du lundi au vendredi, de 9 h à 18 h (horaires fictifs).':/devis/i.test(q)?'Vous pouvez demander un devis depuis votre espace client. Un conseiller vous recontactera.':/suiv|demande/i.test(q)?'Vous pouvez suivre vos demandes dans votre tableau de bord. Cette démonstration présente un parcours fictif.':/personne|humain/i.test(q)?'Bien sûr. Je peux vous orienter vers un membre de l’équipe pour un accompagnement personnalisé.':'Je peux vous aider sur les offres, les horaires, les devis et le suivi des demandes. Que souhaitez-vous savoir ?';state.messages.push({me:true,text:q},{me:false,text:a});render();$('chat').scrollTop=$('chat').scrollHeight}
function blog(){let d=state.articles.filter(x=>state.filter==='Tous'||x.state===state.filter);return `<div class="grid kpis">${[['Articles suivis',state.articles.length],['Publications ce mois','3'],['Visites estimées','1 284 · exemple'],['Articles en attente',state.articles.filter(x=>x.state==='À relire').length]].map(a=>`<div class="panel metric"><div class="label">${a[0]}</div><div class="num">${a[1]}</div></div>`).join('')}</div>${panel('Calendrier éditorial',`<div class="filterline"><select class="btn" onchange="state.filter=this.value;render()">${['Tous','Brouillon','À relire','Programmé','Publié'].map(s=>`<option ${state.filter===s?'selected':''}>${s}</option>`).join('')}</select>${btn('+ Nouvel article','newArticle()','primary')}</div><table class="table"><thead><tr><th>Article</th><th>Canal</th><th>Statut</th><th>Date prévue</th><th></th></tr></thead><tbody>${d.map(x=>`<tr><td class="strong">${esc(x.title)}</td><td>${x.channel}</td><td>${badge(x.state)}</td><td>${x.date}</td><td>${btn('Ouvrir',`articleDetail(${state.articles.indexOf(x)})`,'small')}</td></tr>`).join('')}</tbody></table>`)}<div class="blocksp">${panel('Contrôle éditorial',`<p class="desc">Avant publication : vérification des faits, des sources, de l’orthographe et des informations commerciales.</p><div class="grid twocol"><div>${badge('Vérification humaine requise')}<p class="sub">Les brouillons ne sont jamais publiés sans validation humaine dans cette démonstration.</p></div>${btn('Voir les articles à relire',"state.filter='À relire';render()")}</div>`)}</div>`}
function newArticle(){modal('Créer un article',`<label>Titre de l’article</label><input class="field" id="newtitle" placeholder="Saisissez un titre"><label>Canal</label><select class="field" id="newchannel"><option>Blog</option><option>Newsletter</option></select><div class="spacer"></div>${btn('Créer un brouillon','saveArticle()','primary')}`)}
function saveArticle(){let t=$('newtitle').value.trim();if(!t)return toast('Saisissez un titre');state.articles.unshift({title:t,state:'Brouillon',channel:$('newchannel').value,date:'À définir'});closeModal();render();toast('Brouillon créé')}
function articleDetail(i){let a=state.articles[i];modal(esc(a.title),`<p><b>Canal :</b> ${a.channel}</p><p><b>Statut :</b> ${a.state}</p><p>Article fictif de démonstration. La publication réelle nécessiterait un circuit de validation.</p>${btn('Marquer comme relu',`approveArticle(${i})`,'primary')}`)}
function approveArticle(i){state.articles[i].state='Programmé';closeModal();render();toast('Statut mis à jour : Programmé')}
function agents(){let data=[['Agent commercial','Qualification des contacts et préparation des relances','En service','132 tâches'],['Agent support','Recherche de réponses et préparation des messages','En service','246 tâches'],['Agent contenu','Préparation de publications et contrôle éditorial','En test','18 brouillons']];return `<div class="cards3">${data.map((a,i)=>`<div class="panel"><div style="font-size:30px;color:var(--orange)">✧</div><h2 style="margin:15px 0">${a[0]}</h2><p class="desc" style="min-height:54px">${a[1]}</p>${badge(a[2])}<p class="sub">${a[3]} ce mois (simulation)</p>${btn('Ouvrir l’agent',`agentDetail(${i})`,'primary')}</div>`).join('')}</div><div class="blocksp">${panel('Fonctionnement des agents',`<div class="grid detail">${[['1. Réception','L’agent reçoit une demande ou une tâche.'],['2. Préparation','Il consulte les informations autorisées.'],['3. Validation','L’utilisateur garde le contrôle des actions importantes.']].map(a=>`<div><h3>${a[0]}</h3><p class="sub">${a[1]}</p></div>`).join('')}</div>`)}</div>`}
function agentDetail(i){let name=['Agent commercial','Agent support','Agent contenu'][i];modal(name,`<p>Découvrez le flux de travail de cet agent et les étapes soumises à validation humaine.</p><div class="listrow"><div class="grow">État du service</div>${badge('En test')}</div><div class="listrow"><div class="grow">Dernière activité fictive</div><b>Aujourd’hui</b></div>${btn('Exécuter une simulation',"closeModal();toast('Simulation de l’agent terminée')",'primary')}`)}
function automations(){return `<div class="row sectionhead"><div><h2>Vos processus automatisés</h2><p class="sub">Suivi des exécutions et des validations</p></div>${btn('+ Nouvelle automatisation',"demoNotice('Nouvelle automatisation')",'primary')}</div><div class="grid kpis">${[['Exécutions ce mois','287'],['Réussite simulée','99,2 % · exemple'],['Processus actifs',state.autos.filter(x=>x.state==='Active').length],['À vérifier','2']].map(a=>`<div class="panel metric"><div class="label">${a[0]}</div><div class="num">${a[1]}</div></div>`).join('')}</div>${panel('Toutes les automatisations',`<table class="table"><thead><tr><th>Processus</th><th>Statut</th><th>Exécutions</th><th>Taux de réussite</th><th>Contrôles</th></tr></thead><tbody>${state.autos.map((a,i)=>`<tr><td class="strong">${a.name}</td><td>${badge(a.state)}</td><td>${a.runs}</td><td>${a.success} %</td><td>${btn('Détails',`automationDetail(${i})`,'small')} ${btn(a.state==='Active'?'Mettre en pause':'Reprendre',`toggleAutomation(${i})`,'small')}</td></tr>`).join('')}</tbody></table>`)}<div class="blocksp">${panel('Journal des exécutions',state.autos.slice(0,3).map(a=>`<div class="listrow"><span>✓</span><div class="grow">${a.name}<div class="sub">Exécution de démonstration</div></div>${badge('Terminé')}</div>`).join(''))}</div>`}
function toggleAutomation(i){state.autos[i].state=state.autos[i].state==='Active'?'En pause':'Active';render();toast('État modifié dans la démonstration')}
function automationDetail(i){let a=state.autos[i];modal(a.name,`<p><b>Déclencheur :</b> Réception d’une demande ou événement programmé.</p><p><b>Étapes :</b> Collecte → Analyse → Préparation → Validation → Historique.</p><p><b>Exécutions fictives :</b> ${a.runs}</p>${btn('Tester le scénario',"closeModal();toast('Test simulé : scénario terminé')",'primary')}`)}
function documents(){return `${panel('Bibliothèque documentaire',`<div class="filterline"><input class="field" id="docsearch" placeholder="Rechercher un document..." oninput="filterDocuments(this.value)">${btn('+ Ajouter un document',"demoNotice('Ajouter un document')",'primary')}</div><div id="docrows">${documentRows('')}</div>`)}<div class="blocksp">${panel('À propos des fichiers',`<p class="desc">Cette maquette contient des documents fictifs. Les aperçus sont interactifs, mais aucun fichier privé n’est chargé.</p>`)}</div>`}
function documentRows(q){return state.docs.filter(x=>x.name.toLowerCase().includes(q.toLowerCase())).map((a,i)=>`<div class="listrow"><div style="font-size:24px;color:var(--orange)">▧</div><div class="grow"><div class="strong">${a.name}</div><div class="sub">${a.type} · ${a.date}</div></div>${btn('Aperçu',`openDocument(${state.docs.indexOf(a)})`,'small')}${btn('Télécharger',`downloadDocument(${state.docs.indexOf(a)})`,'small')}</div>`).join('')||'<div class="empty">Aucun document correspondant.</div>'}
function filterDocuments(q){$('docrows').innerHTML=documentRows(q)}
function openDocument(i){let a=state.docs[i];modal(esc(a.name),`<div style="background:#faf8f3;border:1px solid var(--line);padding:25px;border-radius:12px"><div class="eyebrow">Document fictif</div><h3>${esc(a.name)}</h3><p>Exemple de document client destiné à illustrer les livrables disponibles depuis cet espace.</p><p>• Contexte et objectifs<br>• Observations principales<br>• Recommandations<br>• Prochaines étapes</p></div><div class="spacer"></div>${btn('Télécharger un exemple',`downloadDocument(${i});closeModal()`,'primary')}`)}
function downloadDocument(i){let a=state.docs[i];let content=`${a.name}\n\nDocument de démonstration fictif.\n\nContexte et objectifs\nObservations principales\nRecommandations\nProchaines étapes\n`;let url=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));let x=document.createElement('a');x.href=url;x.download=a.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-')+'.txt';x.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Fichier exemple téléchargé')}
function team(){return `${panel('Accès à votre espace',`<div class="row" style="margin-bottom:12px"><p class="sub">Gestion des profils fictifs</p>${btn('+ Inviter un membre',"inviteMember()",'primary')}</div>${[['Camille Martin','Administratrice','camille@exemple.fr'],['Thomas Leroy','Responsable commercial','thomas@exemple.fr'],['Sarah Petit','Collaboratrice','sarah@exemple.fr']].map((a,i)=>`<div class="listrow"><div class="avatar">${a[0].split(' ').map(x=>x[0]).join('')}</div><div class="grow"><div class="strong">${a[0]}</div><div class="sub">${a[2]}</div></div>${badge(a[1])}${btn('Gérer',`demoNotice('Gestion du profil')`,'small')}</div>`).join('')}`)}`}
function inviteMember(){modal('Inviter un collaborateur',`<label>Adresse e-mail</label><input id="invite" type="email" class="field" placeholder="nom@entreprise.fr"><label>Rôle</label><select class="field"><option>Collaborateur</option><option>Responsable</option></select><p class="help">Aucune invitation réelle ne sera envoyée.</p>${btn('Simuler l’invitation',"closeModal();toast('Invitation simulée, aucun e-mail envoyé')",'primary')}`)}
function settings(){return `<div class="grid twocol">${panel('Informations de l’espace',`<label>Nom de l’entreprise</label><input class="field" value="Entreprise exemple" id="company"><label>Nom de l’espace</label><input class="field" value="Portail client" id="workspace"><div class="spacer"></div>${btn('Enregistrer les préférences',"toast('Préférences enregistrées dans cette session')",'primary')}`)}${panel('Notifications & validations',`${[['digest','Résumé d’activité quotidien'],['approval','Validation humaine obligatoire'],['alerts','Alertes de suivi']].map(a=>`<div class="listrow"><div class="grow strong">${a[1]}</div><input class="check" type="checkbox" ${state.toggles[a[0]]?'checked':''} onchange="state.toggles['${a[0]}']=this.checked;toast('Préférence modifiée')"></div>`).join('')}`)}</div><div class="blocksp">${panel('Démonstration',`<p class="sub">Toutes les données sont inventées et restent dans la page. Aucun backend, aucune authentification, aucun appel à des services extérieurs.</p>${btn('Revenir à l’accueil',"go('home')")}`)}</div>`}
function search(){let q=$('search').value.toLowerCase().trim();if(!q)return;let p=pages.find(x=>x[2].toLowerCase().includes(q));if(p){go(p[0]);toast('Module ouvert : '+p[2])}else{toast('Aucun module trouvé pour « '+q.slice(0,40)+' »')}}
function render(){let page=names[state.page]?state.page:'home';let views={home,audit,knowledge,chatbot,blog,agents,automations,documents,team,settings};$('app').innerHTML=`<div class="layout"><aside class="side" id="side"><div class="brand"><span class="brandmark">◈</span> Espace démo · Connaissances</div><nav class="nav">${pages.map(a=>`<button class="${page===a[0]?'active':''}" onclick="go('${a[0]}')"><span class="ico">${a[1]}</span>${a[2]}</button>`).join('')}</nav><div class="sidefoot">ESPACE CLIENT<br><b style="color:#fff">Entreprise exemple</b><br><span style="color:#b0a398">● Démonstration interactive</span></div></aside><main class="main"><header class="top"><div><div class="eyebrow">ENTREPRISE EXEMPLE / ESPACE CLIENT</div><h1>${names[page]}</h1><p>${subtitle[page]}</p></div><div class="tools"><button class="btn mobilemenu" onclick="$('side').classList.toggle('open')">☰ Menu</button><input id="search" class="search" placeholder="⌕ Rechercher un module..." onkeydown="if(event.key==='Enter')search()"><button class="btn" onclick="showNotifications()" title="Notifications">♧ <span style="color:var(--orange)">${state.notifications}</span></button><button class="avatar" onclick="go('settings')">EE ▾</button></div></header><div class="body"><div class="bread">Espace client / <strong>${names[page]}</strong> <span style="float:right">Données fictives · Démonstration</span></div>${views[page]()}<div class="footer">Espace démo · Connaissances · Interface fictive de démonstration · Aucune donnée réelle</div></div></main></div><div class="modalback hide" id="modal" onclick="if(event.target===this)closeModal()"></div><div class="toast hide" id="toast"></div>`}
function showNotifications(){modal('Notifications',`<div class="listrow"><div class="grow"><b>Article à relire</b><div class="sub">Une publication nécessite votre validation.</div></div>${btn('Ouvrir',"closeModal();go('blog')",'small')}</div><div class="listrow"><div class="grow"><b>Fiche Knowledge à vérifier</b><div class="sub">Une source a été mise à jour.</div></div>${btn('Ouvrir',"closeModal();go('knowledge')",'small')}</div><div class="listrow"><div class="grow"><b>Rapport de diagnostic</b><div class="sub">Le document est disponible.</div></div>${btn('Ouvrir',"closeModal();go('documents')",'small')}</div>`)}
window.addEventListener('hashchange',()=>{let p=location.hash.slice(1);if(names[p]&&p!==state.page){state.page=p;render()}});let hash=location.hash.slice(1);if(names[hash])state.page=hash;render();
</script>
<script>
(function(){
 const scenes=[
 {id:'intro',page:'home',label:'Un espace de démonstration, avec des données d’exemple',focus:'.kpis'},
 {id:'dashboard',page:'home',label:'Toutes les informations au même endroit',focus:'.cols'},
 {id:'clients',page:'chatbot',label:'Une demande client ? L’assistant peut proposer une réponse, à vérifier',focus:'.panel'},
 {id:'relances',page:'automations',label:'L’assistant peut préparer une relance, à vérifier',focus:'.table'},
 {id:'documents',page:'knowledge',label:'Les réponses peuvent s’appuyer sur vos fiches (exemple)',focus:'.panel'},
 {id:'controle',page:'home',label:'Vos équipes gardent le contrôle',focus:'.blocksp'},
 {id:'guide',page:'home',label:'Commentez AUTOMATISER pour recevoir le guide',focus:'.kpis'},
 {id:'diagnostic',page:'audit',label:'Diagnostic IA gratuit de 45 minutes',focus:'.kpis'}
 ];
 let step=0,timer=null;
 const el=(s)=>document.querySelector(s);
 function ensure(){if(el('#film-toolbar'))return;const bar=document.createElement('div');bar.id='film-toolbar';bar.innerHTML='<span>MODE VIDÉO</span><button id="film-play">▶ Démo</button><button id="film-next">Étape suivante</button><button id="film-reset">↺</button><label><input id="film-label" type="checkbox" checked> Libellés</label>';
 document.body.appendChild(bar);const spot=document.createElement('div');spot.id='film-spot';document.body.appendChild(spot);const status=document.createElement('div');status.id='film-status';document.body.appendChild(status);
 el('#film-play').onclick=()=>window.demoVideo.play();el('#film-next').onclick=()=>window.demoVideo.next();el('#film-reset').onclick=()=>window.demoVideo.reset();}
 function highlight(selector){const target=el(selector);const spot=el('#film-spot');if(!target){spot.style.display='none';return;}const b=target.getBoundingClientRect();spot.style.display='block';spot.style.left=(b.left-5)+'px';spot.style.top=(b.top-5)+'px';spot.style.width=(b.width+10)+'px';spot.style.height=(Math.min(b.height,440)+10)+'px';}
 function show(n){ensure();step=Math.max(0,Math.min(n,scenes.length-1));const s=scenes[step];window.go(s.page);document.body.classList.add('demo-filming');const status=el('#film-status');status.textContent=s.label;status.style.display=(el('#film-label')?.checked===false)?'none':'block';setTimeout(()=>highlight(s.focus),180);return {index:step,id:s.id,label:s.label,page:s.page};}
 function reset(){clearInterval(timer);document.body.classList.remove('demo-filming');if(el('#film-spot'))el('#film-spot').style.display='none';if(el('#film-status'))el('#film-status').style.display='none';window.go('home');step=0;}
 window.demoVideo={scenes,show,next:()=>show((step+1)%scenes.length),reset,play:(ms=3900)=>{reset();show(0);timer=setInterval(()=>{if(step===scenes.length-1){clearInterval(timer);return;}show(step+1);},ms)},stop:()=>clearInterval(timer)};

 const ETAPES={taches:{scene:'intro'},ensemble:{scene:'dashboard'},reponse:{scene:'clients'},relance:{scene:'relances'},recherche:{scene:'documents'},controle:{scene:'controle'},fin:{page:'home'}};
 window.demoMaquette={
  etapes:Object.keys(ETAPES),
  aller(id){const e=ETAPES[id];if(!e)throw new Error('Étape inconnue : '+id);
   if(e.scene)return window.demoVideo.show(scenes.findIndex(x=>x.id===e.scene));
   window.demoVideo.reset();return {id:id,page:e.page};},
  reinitialiser(){window.demoVideo.reset();}
 };
 window.addEventListener('DOMContentLoaded',ensure);if(document.readyState!=='loading')ensure();
 if(new URLSearchParams(location.search).get('autoplay')==='1'){setTimeout(()=>window.demoVideo.play(),500)}
})();
</script>
</body></html>
